  if (a === 'delTpl'){ S.templates.splice(+d.i, 1); save(); render(); return; }

  if (a === 'nutMove'){ var nd = addDays(parse(S.ui.nutDate), +d.n); S.ui.nutDate = iso(nd); save(); render(); return; }
  if (a === 'nutReset'){
    S.nut[S.ui.nutDate] = { p:0,f:0,c:0,sugar:0,fiber:0,sodium:0 };
    if (S.mealsLog) S.mealsLog[S.ui.nutDate] = [];
    save(); render(); toast('已清零'); return;
  }

  /* 进度旁边的小加减：一律 ±1（钠和热量也是 ±1，5 那个颗粒度只属于拖拽）。
     基准取「屏幕上那个整数」而不是原始小数，否则会先对齐到步长整倍，
     115.4 点 +1 变成 116（只涨 0.6）。 */
  if (a === 'nutStep'){
    var kS = d.k, dirS = (+d.dir) >= 0 ? 1 : -1;
    var nS = nutOf(S.ui.nutDate);
    var curS = (kS === 'kcal') ? nutKcal(nS) : (+nS[kS] || 0);
    nutSetValue(kS, Math.max(0, Math.round(curS) + dirS));
    save(); render(); return;
  }

  if (a === 'quickAdd'){
    var fid = el('qfSel').value, g = +el('qfGram').value || 0;
    var f = foodById(fid);

    S.ui.qfFood = fid;                 /* 记住这次选的，下次渲染不会被重置 */
    var n = nutOf(S.ui.nutDate);
    n.p += f.p * g/100; n.f += f.f * g/100; n.c += f.c * g/100;
    n.sugar += (f.sugar||0) * g/100; n.fiber += (f.fiber||0) * g/100;
    /* 食材自带钠：按每 100 g 的典型值累加，调味料另外手填 */
    var naAdd = (f.na || 0) * g/100;
    n.sodium += naAdd;
    mealsLogOf(S.ui.nutDate).push({
      fid: fid, name: foodLabel(f), g: g,
      p: f.p*g/100, f: f.f*g/100, c: f.c*g/100,

  if (a === 'delMeal'){

    nD.p = Math.max(0, nD.p - (+itD.p||0));
    nD.f = Math.max(0, nD.f - (+itD.f||0));
    nD.c = Math.max(0, nD.c - (+itD.c||0));
    nD.sugar = Math.max(0, nD.sugar - (+itD.sugar||0));
    nD.fiber = Math.max(0, nD.fiber - (+itD.fiber||0));
    nD.sodium = Math.max(0, nD.sodium - (+itD.na||0));

  if (a === 'setVariant'){

  if (a === 'toggleFood'){

  if (a === 'logWeight'){

    S.weights[todayKey()] = v;

  }

  if (a === 'exportData'){
    try {
      /* 导出整个状态；这里把两块最容易「以为没带上」的数据显式钉住：
         身体数据（profile + weights 体重记录）和自定义食材（customFoods） */
      var packExp = JSON.parse(JSON.stringify(S));
      packExp.profile = packExp.profile || {};
      packExp.weights = packExp.weights || {};
      packExp.customFoods = packExp.customFoods || [];
      var blob = new Blob([JSON.stringify(packExp, null, 1)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var link = document.createElement('a');
      link.href = url;
      link.download = 'rushfit-backup-' + todayKey() + '.json';
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
      toast(S.lang === 'en' ? 'Backup exported · body data and custom foods included' : '已导出备份 · 含身体数据和自定义食材');
    } catch (e) { toast('导出失败，换个浏览器试试'); }
    return;
  }
  if (a === 'importData'){
    var fi = document.getElementById('importFile');
    if (fi) { fi.value = ''; fi.click(); }
    return;
  }

  /* ---- 自己写（插件 / 导入数据 / 提示词） ---- */
  if (a === 'plugTab'){ S.ui.plugTab = d.k; save(); render(); return; }
  if (a === 'importPack'){
    var fp = document.getElementById('importPackFile');
    if (fp) { fp.value = ''; fp.click(); }

  }
  if (a === 'importPaste'){
    var taP = document.getElementById('packPaste');
    var rawP = taP ? taP.value : '';
    if (!String(rawP).trim()){ toast(S.lang === 'en' ? 'Paste the JSON first' : '先把 JSON 粘进来'); return; }
    packDraft = '';                       /* 成功后重渲染会读它，先清空 */
    if (!importPackText(rawP)) packDraft = rawP;   /* 失败留着原文，方便改 */
    return;
  }
  if (a === 'copyPrompt'){
    copyText(packPrompt(), function (ok) {
      toast(ok ? '提示词已复制，发给 AI 就行' : '复制失败，长按文字手动全选');

  if (a === 'togglePlug'){ S.plugs[d.id] = !S.plugs[d.id]; save(); render(); return; }
  if (a === 'rtStart'){ startRest(+d.sec); return; }
  if (a === 'rtAdd'){ if (RT.endAt){ RT.endAt += (+d.sec || 30) * 1000; paintRest(); } return; }
  if (a === 'rtStop'){ stopRest(); return; }
  if (a === 'waterSet'){ if (!S.water) S.water = {}; S.water[S.ui.nutDate] = +d.i; save(); render(); return; }

/* ================= 输入校验 ================= */
/* 原则：非法值只提示，不写进状态、不重渲染 —— 这样用户还能看到自己填的内容 */
var PROF_RANGE = {
  height:[120,230], weight:[30,250], age:[10,100], bodyFat:[3,60], bfGoal:[5,45],
  muscleMass:[5,80], muscleProtein:[3,40], bmr:[600,4000],
  water:[30,75], visceral:[1,30], bone:[0.5,6],
  segTorso:[5,60], segArmR:[0.3,15], segArmL:[0.3,15], segLegR:[1,25], segLegL:[1,25]
};

function numIn(inp, min, max){
  var raw = String(inp.value == null ? '' : inp.value).trim();
  if (raw === '') return { ok:false, empty:true };
  var v = Number(raw.replace(',', '.'));
  if (!isFinite(v)) return { ok:false };
  if (min != null && v < min) return { ok:false };
  if (max != null && v > max) return { ok:false };
  return { ok:true, v:v };
}

function fieldLabelFor(inp){
  var f = inp.closest ? inp.closest('.field') : null;
  return f ? f.querySelector('label') : null;
}

function setInvalid(inp, bad, rg){
  if (!inp) return;
  if (bad) inp.classList.add('bad'); else inp.classList.remove('bad');
  var lab = fieldLabelFor(inp);
  if (lab){
    var star = lab.querySelector('.req-star');
    if (bad && !star){
      star = document.createElement('span');
      star.className = 'req-star';
      star.textContent = '*';
      lab.appendChild(star);
    } else if (!bad && star){
      star.parentNode.removeChild(star);
    }
  }
  if (bad && rg) inp.title = '请输入 ' + rg[0] + '–' + rg[1] + ' 之间的数值';
  else inp.removeAttribute('title');
}

/* 动作卡片里的组输入：红框 + 动作名右侧红星 */
function markExBad(inp, bad){
  if (!inp) return;
  if (bad) inp.classList.add('bad'); else inp.classList.remove('bad');
  var sh = inp.closest('.ex-shell');
  if (!sh) return;
  var anyBad = sh.querySelectorAll('input.bad').length > 0;
  sh.classList.toggle('has-bad', anyBad);
  var nm = sh.querySelector('.ex-name');
  if (!nm) return;
  var star = nm.querySelector('.req-star');
  if (anyBad && !star){
    star = document.createElement('span');
    star.className = 'req-star';
    star.textContent = '*';
    nm.appendChild(star);
  } else if (!anyBad && star){
    star.parentNode.removeChild(star);
  }
}

document.addEventListener('change', function (e) {
  var t = e.target;

  /* 有氧：改类型或时长时，按体重自动重算消耗 */
  if (t.id === 'cdType' || t.id === 'cdMin'){
    var mt = document.getElementById('cdType'), mm2 = document.getElementById('cdMin'), mk = document.getElementById('cdKcal');
    if (mt && mm2 && mk){
      var mmv = parseInt(mm2.value, 10);
      if (mmv > 0 && mmv <= 300) mk.value = cardioEst(mt.value, mmv, BM.weight);
    }
    return;
  }

  /* 有氧已记录行：改分钟或消耗 */
  if (t.dataset.ci != null && t.dataset.cf){
    var dkC = t.dataset.date, ixC = +t.dataset.ci;
    var arrC = S.cardio && S.cardio[dkC];
    if (!arrC || !arrC[ixC]) return;
    var limC = (t.dataset.cf === 'min') ? [1, 300] : [0, 2000];
    var chkC = numIn(t, limC[0], limC[1]);
    if (!chkC.ok){ setInvalid(t, true, limC); return; }
    setInvalid(t, false);
    arrC[ixC][t.dataset.cf] = Math.round(chkC.v);
    save(); render();
    return;
  }

  if (t.dataset.profile){
    var k = t.dataset.profile;
    var rg = PROF_RANGE[k];
    if (k === 'bmr' && String(t.value).trim() === ''){ setInvalid(t, false); S.profile[k] = 0; save(); render(); return; }
    var chkP = numIn(t, rg ? rg[0] : 0, rg ? rg[1] : 9999);
    if (!chkP.ok){ setInvalid(t, true, rg); return; }   /* 不写状态、不重渲染，只标红 */
    setInvalid(t, false);
    S.profile[k] = chkP.v;
    save(); render(); return;
  }

  if (t.dataset.nut){
    /* 钠按 mg 计，一天吃到 4000–5000 很正常，上限不能跟其他项一样卡 3000 */
    var hiN = (t.dataset.nut === 'sodium') ? 8000 : 3000;
    var chkN = numIn(t, 0, hiN);
    if (!chkN.ok && !chkN.empty){ setInvalid(t, true, [0, hiN]); return; }
    setInvalid(t, false);
    var nn = nutOf(S.ui.nutDate);
    nn[t.dataset.nut] = chkN.empty ? 0 : chkN.v;
    save(); render(); return;
  }

  if (t.dataset.field){
    var f = t.dataset.field;
    if (f === 'sessions'){ S.weekly.sessions = +t.value; }
    if (f === 'split'){ S.weekly.split = t.value; }
    if (f === 'actNeat'){ S.actNeat = parseFloat(t.value) || 1.25; }
    if (f === 'actSess'){ S.actSess = Math.max(0, Math.min(6, +t.value || 0)); }
    if (f === 'sex'){
      var wasM = (S.profile.sex !== 'female');
      S.profile.sex = (t.value === 'female') ? 'female' : 'male';
      /* 体脂目标若还停在前一个性别的默认值，就跟着换；用户自己改过的不动 */
      var oldDef = wasM ? 17 : 24, newDef = (S.profile.sex === 'female') ? 24 : 17;
      if (S.profile.bfGoal == null || S.profile.bfGoal === oldDef) S.profile.bfGoal = newDef;
    }
    if (f === 'actMode'){
      S.actMode = t.value;
      if (t.value === 'split' && !S.exKcal) S.exKcal = 240;
    }
    if (f === 'watchTotal'){
      var cw = numIn(t, 800, 8000);
      if (!cw.ok && !cw.empty){ setInvalid(t, true, [800, 8000]); return; }
      setInvalid(t, false); S.watchTotal = cw.empty ? 0 : cw.v;
    }
    if (f === 'exKcal'){
      var ce = numIn(t, 0, 3000);
      if (!ce.ok && !ce.empty){ setInvalid(t, true, [0, 3000]); return; }
      setInvalid(t, false); S.exKcal = ce.empty ? 0 : ce.v;
    }
    if (f === 'neat'){ S.neat = parseFloat(t.value); }
    if (f === 'carbMode'){ S.carbMode = t.value; }
    if (f === 'meals'){ S.ui.meals = +t.value; }
    if (f === 'meatBf'){ S.ui.meatBf = (t.value === '1'); }
    if (f === 'meat'){ S.ui.meat = t.value; }
    if (f === 'carb'){ S.ui.carb = t.value; }
    save(); render(); return;
  }

  if (t.dataset.bal){
    var chkB = numIn(t, 0, 2000);
    if (!chkB.ok && !chkB.empty){ setInvalid(t, true, [0, 2000]); return; }
    setInvalid(t, false);
    var recB2 = S.bal[S.ui.nutDate] || (S.bal[S.ui.nutDate] = { g:{}, locked:{} });
    var vB2 = chkB.empty ? 0 : chkB.v;
    recB2.g[t.dataset.bal] = vB2;
    if (vB2 > 0) recB2.locked[t.dataset.bal] = true;   /* 手动改过就锁住，配平不再动它 */
    save(); render(); return;
  }

  if (t.dataset.variant){
    S.variants[t.dataset.variant] = t.value;
    var recV = S.bal[S.ui.nutDate];
    if (recV){ recV.g = {}; recV.solved = false; }
    save(); render(); return;
  }

  if (t.dataset.tplmonths){
    var tpM = S.templates[+t.dataset.tplmonths];
    if (tpM){ tpM.months = +t.value; tpM.created = tpM.created || iso(new Date()); }
    save(); render(); return;
  }

  if (t.dataset.set){
    var date = t.dataset.date, log = ensureLog(date);
    var it = log.items[+t.dataset.ex]; if (!it) return;
    var st = it.sets[+t.dataset.si]; if (!st) return;
    var lim = (t.dataset.set === 'w') ? [0, 600] : [0, 500];
    var chkS = (String(t.value).trim() === '') ? { ok:true, v:null } : numIn(t, lim[0], lim[1]);
    if (!chkS.ok){ markExBad(t, true); return; }        /* 标红 + 动作名加星，不写状态 */
    markExBad(t, false);
    var val = chkS.v;
    if (t.dataset.set === 'w') st.w = val; else st.r = val;
    save();
    /* 不整页重渲染，避免跳焦点；只在勾选状态变化时重绘 */
    return;
  }
});

  if (t.id === 'importPackFile'){

  if (t.id !== 'importFile' || !t.files || !t.files[0]) return;
  var r = new FileReader();

      var data = JSON.parse(String(r.result));
      if (!data || !data.profile) throw new Error('bad');
      if (!confirm(trTxt('导入会覆盖当前全部记录，确定继续？'))) return;
      S = data;
      if (!S.ui) S.ui = defaultState().ui;
      if (!S.plugs) S.plugs = defaultState().plugs;
      migrate(S);            /* 老备份缺的字段补齐，别让新版本的视图读到 undefined */
      save(); render();
      toast('已导入备份');

  };

/* ================= 替换面板 ================= */
function swapBtn(n, r){
  var m = exMeta(n);
  var lp = lastPerf(n, r.date);
  return '<button class="swap-item" data-action="swapTo" data-name="' + h(n) + '" data-ex="' + r.ex + '" data-date="' + r.date + '">' +
    '<span class="swap-n">' + h(n) + '</span>' +
    '<span class="swap-m">' + m.tag + ' · ' + (lp ? '上次 ' + lp.maxW + ' kg' : '无记录') + '</span></button>';
}

function replaceSheet(){
  var r = S.ui.replaceFor;
  if (!r) return '';
  var lg = logOf(r.date);
  var it = lg.items[r.ex];
  if (!it) return '';
  var name = it.name;
  var meta = exMeta(name);
  var allowed = function (n) { return S.excludePatterns.indexOf(exMeta(n).pat) < 0; };
  var others = EX_LIB.filter(function (n) { return n !== name; });
  var same = others.filter(function (n) { return exMeta(n).pat === meta.pat && allowed(n); });
  var sameMus = others.filter(function (n) {
    var m = exMeta(n);
    return m.pat !== meta.pat && exFam(n) === exFam(name) && allowed(n);
  });
  var rest = others.filter(function (n) {
    return same.indexOf(n) < 0 && sameMus.indexOf(n) < 0 && allowed(n);
  });
  var blocked = S.excludePatterns.indexOf(meta.pat) >= 0;

  var out = '<div class="sheet-mask" data-action="closeSheet"></div><div class="sheet">';
  out += '<div class="sheet-hd"><div><h4>调整「' + h(name) + '」</h4>' +
         '<span class="src">' + meta.tag + ' · ' + meta.muscle + '</span></div>' +
         '<button class="btn icon" data-action="closeSheet">' + svgX() + '</button></div>';
  out += '<div class="sheet-bd">';

  if (same.length){
    out += '<div class="sheet-sec"><div class="sheet-t">同类动作（' + meta.tag + '）</div><div class="swap-grid">';
    same.forEach(function (n) { out += swapBtn(n, r); });
    out += '</div></div>';
  } else if (blocked){
    out += '<div class="sheet-sec"><div class="sheet-t">同类动作</div>' +
           '<div class="src">已排除「' + meta.tag + '」类</div></div>';
  }

  if (sameMus.length){
    out += '<div class="sheet-sec"><div class="sheet-t">同肌群，换个模式（' + meta.muscle + '）</div><div class="swap-grid">';
    sameMus.forEach(function (n) { out += swapBtn(n, r); });
    out += '</div></div>';
  }

  if (rest.length){
    out += '<div class="sheet-sec"><div class="sheet-t">其他动作</div><div class="swap-grid">';
    rest.slice(0, 12).forEach(function (n) { out += swapBtn(n, r); });
    out += '</div></div>';
  }

  out += '<div class="sheet-sec"><label class="chk-line">' +
         '<input type="checkbox" data-action="excludePat" data-pat="' + meta.pat + '"' + (blocked ? ' checked' : '') + '> ' +
         '以后不再推荐「' + meta.tag + '」类动作</label></div>';

  out += '<div class="sheet-foot">' +
         '<button class="btn sm" data-action="moveEx" data-n="-1" data-ex="' + r.ex + '" data-date="' + r.date + '">↑ 上移</button>' +
         '<button class="btn sm" data-action="moveEx" data-n="1" data-ex="' + r.ex + '" data-date="' + r.date + '">↓ 下移</button>' +
         '<button class="btn sm danger" data-action="swapTo" data-name="__delete" data-ex="' + r.ex + '" data-date="' + r.date + '">删除这个动作</button>' +
         '</div>';
  out += '</div></div>';
  return out;
}

/* ================= 手势：左滑显示操作 / 长按拖动排序 ================= */
/* 触摸和鼠标走同一套逻辑：
   - pointerdown / touchstart 都作为起点（有些环境只给其中一个）
   - pointermove / touchmove 都驱动移动，pointerType==='touch' 时跳过 pointermove 避免重复
   - 长按 380ms 进入拖动；拖动中 touchmove 用 preventDefault 抢回滚动控制权
   - 贴近屏幕上下边缘时自动滚动，长列表也能把动作拖到顶部 */
(function gestures(){
  var shell = null, kind = null, sx = 0, sy = 0, timer = null, curX = 0, date = null;
  var lastY = 0, auto = null;

  function reorderAt(y){
    if (!shell) return;
    var shells = [].slice.call(document.querySelectorAll('.ex-shell'));
    for (var k = 0; k < shells.length; k++){
      var other = shells[k];
      if (other === shell) continue;
      var r = other.getBoundingClientRect();
      if (y > r.top && y < r.bottom){
        var mid = r.top + r.height / 2;
        if (y < mid) other.parentNode.insertBefore(shell, other);
        else other.parentNode.insertBefore(shell, other.nextSibling);
        return;
      }
    }
  }

  function autoScroll(){
    if (auto) return;
    auto = setInterval(function () {
      if (kind !== 'drag' || !shell){ stopAuto(); return; }
      var y = lastY;
      if (y < 90) window.scrollBy(0, -16);
      else if (y > window.innerHeight - 140) window.scrollBy(0, 16);
      else return;
      reorderAt(y);
    }, 70);
  }
  function stopAuto(){ if (auto){ clearInterval(auto); auto = null; } }

  function reset(){
    if (shell){
      shell.classList.remove('dragging');
      var a0 = shell.querySelector('.ex-actions');
      if (a0) a0.style.transform = '';
    }
    shell = null; kind = null; date = null; curX = 0;
    if (timer){ clearTimeout(timer); timer = null; }
    stopAuto();
    document.body.classList.remove('ex-dragging');
  }

  var IGNORE = 'input, select, textarea, .act-swap, .act-del, .tick, .addset, .rmset, .more, .ex-rest';

  function begin(x, y, target){
    if (!target || !target.closest) return;
    if (target.closest(IGNORE)) return;
    var sh = target.closest('.ex-shell');
    if (!sh) return;
    /* 同一次触摸里 pointerdown 和 touchstart 都会来，第二次不要重开计时器 */
    if (shell === sh && timer) { sx = x; sy = y; return; }
    if (shell) reset();
    shell = sh;
    var dt = sh.querySelector('[data-date]');
    date = dt ? dt.getAttribute('data-date') : null;
    sx = x; sy = y; curX = 0; lastY = y; kind = null;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      if (!shell || kind) return;
      kind = 'drag';
      shell.classList.add('dragging');
      document.body.classList.add('ex-dragging');
      autoScroll();
      if (navigator.vibrate) { try { navigator.vibrate(14); } catch (e) {} }
    }, 380);
  }

  function move(x, y){
    if (!shell) return;
    var dx = x - sx, dy = y - sy;
    lastY = y;

    if (kind === 'drag'){ reorderAt(y); return; }

    if (kind === null && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) + 4){
      kind = 'swipe';
      if (timer){ clearTimeout(timer); timer = null; }
    }
    if (kind === 'swipe'){
      curX = Math.max(-132, Math.min(0, dx));
      var act = shell.querySelector('.ex-actions');
      if (act) act.style.transform = 'translateX(' + (132 + curX) + 'px)';
      return;
    }

    /* 还没长按就上下动 → 让页面正常滚动 */
    if (kind === null && Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){
      if (timer){ clearTimeout(timer); timer = null; }
      shell = null;
    }
  }

  function finish(){
    if (!shell) return;
    if (timer){ clearTimeout(timer); timer = null; }
    stopAuto();

    if (kind === 'drag'){
      var shells = [].slice.call(document.querySelectorAll('.ex-shell'));
      var order = shells.map(function (x) { return +x.dataset.ex; });
      if (date && S.logs[date]){
        var items = S.logs[date].items;
        var next = order.map(function (k) { return items[k]; }).filter(Boolean);
        if (next.length === items.length){ S.logs[date].items = next; save(); }
      }
      shell.classList.remove('dragging');
      document.body.classList.remove('ex-dragging');
      shell = null; kind = null;
      render();
      toast('顺序已保存');
      return;
    }

    if (kind === 'swipe'){
      if (curX < -60) shell.classList.add('swiped');
      else shell.classList.remove('swiped');
      var act2 = shell.querySelector('.ex-actions');
      if (act2) act2.style.transform = '';
      shell = null; kind = null;
      return;
    }

    /* 只是轻点：什么都不做（操作菜单走右边的「⋯」） */
    shell = null; kind = null;
  }

  /* ---- 鼠标 / 触控笔 ---- */
  document.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    if (e.pointerType === 'touch') return;          /* 触摸交给下面的 touch 分支 */
    begin(e.clientX, e.clientY, e.target);
  }, { passive: true });

  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    if (!shell) return;
    if (kind === 'drag' && e.cancelable) e.preventDefault();
    move(e.clientX, e.clientY);
  }, { passive: false });

  document.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'touch') return;
    finish();
  }, { passive: true });

  document.addEventListener('pointercancel', reset);

  /* ---- 触摸 ---- */
  document.addEventListener('touchstart', function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    begin(t.clientX, t.clientY, e.target);
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    if (!shell) return;
    if (kind === 'drag' || kind === 'swipe'){
      if (e.cancelable) e.preventDefault();          /* 抢回滚动控制权 */
      e.stopPropagation();
    }
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', function () { finish(); }, { passive: true });
  document.addEventListener('touchcancel', reset);

  window.addEventListener('blur', reset);

  /* 长按不再弹出系统「拷贝 / 查询」蓝色菜单 */
  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest && e.target.closest('.ex-shell')) e.preventDefault();
  });

  document.addEventListener('selectstart', function (e) {
    if (e.target.closest && e.target.closest('.ex-shell') && !e.target.closest('input')) e.preventDefault();
  });

  /* 点空白处收起左滑 */
  document.addEventListener('click', function (e) {
    if (e.target.closest('.ex-shell')) return;
    var open = document.querySelectorAll('.ex-shell.swiped');
    for (var i3 = 0; i3 < open.length; i3++) open[i3].classList.remove('swiped');
  }, true);
})();

/* ================= 手势：食材 chips ================= */
/* 长按 420ms 进入编辑并开始拖动；编辑模式下移动即拖。
   拖动中实时换位，松手保存顺序；拖到页面顶端（红色条）松手即删除。
   删除规则：自定义食材真的删掉，内置食材只是从这一栏隐藏，可一键恢复。 */
(function chipGestures(){
  var chip = null, box = null, dragging = false, moved = false;
  var sx = 0, sy = 0, lastX = 0, lastY = 0, timer = null, zone = null, auto = null;

  function zoneEl(){
    var txt = trTxt('拖到这里删除');
    if (zone && zone.parentNode){
      if (zone.textContent !== txt) zone.textContent = txt;
      return zone;
    }
    zone = document.createElement('div');
    zone.className = 'chip-delzone';
    zone.textContent = txt;
    document.body.appendChild(zone);
    return zone;
  }
  function zoneHide(){ if (zone) zone.classList.remove('on', 'hot'); }
  function inDrop(y){ return y < 104; }

  function stopAuto(){ if (auto){ clearInterval(auto); auto = null; } }
  function autoScroll(){
    if (auto) return;
    auto = setInterval(function () {
      if (!dragging){ stopAuto(); return; }
      if (lastY < 96) window.scrollBy(0, -18);
      else if (lastY > window.innerHeight - 130) window.scrollBy(0, 18);
    }, 70);
  }

  function start(){
    if (!chip || dragging) return;
    dragging = true; moved = false;
    if (timer){ clearTimeout(timer); timer = null; }
    chip.classList.add('dragging');
    if (box) box.classList.add('editing');
    document.body.classList.add('chip-dragging');
    zoneEl().classList.add('on');
    if (!S.ui.chipEdit){ S.ui.chipEdit = true; save(); }
    autoScroll();
    if (navigator.vibrate){ try { navigator.vibrate(14); } catch (e) {} }
  }

  function reorderAt(x, y){
    if (!chip || !box) return;
    var kids = [].slice.call(box.querySelectorAll('.food-chip'));
    var best = null, bestD = Infinity, after = false;
    for (var i = 0; i < kids.length; i++){
      var o = kids[i];
      if (o === chip) continue;
      var r = o.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      /* 同一行就只比左右距离；跨行时纵向权重放大，避免被上一行抢走 */
      var sameRow = (y >= r.top - 6 && y <= r.bottom + 6);
      var d = sameRow ? Math.abs(x - cx) : Math.abs(x - cx) + Math.abs(y - cy) * 4;
      if (d < bestD){
        bestD = d; best = o;
        after = sameRow ? (x > cx) : (y > cy);
      }
    }
    if (!best) return;
    if (after){
      if (best.nextSibling !== chip){ box.insertBefore(chip, best.nextSibling); moved = true; }
    } else if (chip.nextSibling !== best){
      box.insertBefore(chip, best); moved = true;
    }
  }

  function begin(x, y, target){
    if (!target || !target.closest) return;
    var c = target.closest('.food-chip');
    if (!c || !c.closest('[data-chips]')) return;
    if (chip && chip !== c) reset();
    chip = c; box = c.closest('[data-chips]');
    sx = x; sy = y; lastX = x; lastY = y; dragging = false; moved = false;
    if (timer){ clearTimeout(timer); timer = null; }
    if (!S.ui.chipEdit) timer = setTimeout(start, 420);
  }

  function move(x, y){
    lastX = x; lastY = y;
    if (!chip) return;
    if (!dragging){
      var dx = Math.abs(x - sx), dy = Math.abs(y - sy);
      if (S.ui.chipEdit){
        if (dx <= 6 && dy <= 6) return;
        start();                            /* 编辑模式：一动就开始拖 */
      } else {
        if (dx > 10 || dy > 10){            /* 没长按就上下滑 → 让页面正常滚动 */
          if (timer){ clearTimeout(timer); timer = null; }
          chip = null; box = null;
        }
        return;
      }
    }
    if (inDrop(y)){
      var z = zoneEl();
      z.classList.toggle('hot', true);
      return;                                /* 进了删除区就不再换位 */
    }
    if (zone) zone.classList.remove('hot');
    reorderAt(x, y);
  }

  function reset(){
    if (chip) chip.classList.remove('dragging');
    chip = null; box = null; dragging = false; moved = false;
    if (timer){ clearTimeout(timer); timer = null; }
    stopAuto(); zoneHide();
    document.body.classList.remove('chip-dragging');
  }

  function finish(){
    if (!chip){ zoneHide(); stopAuto(); return; }
    if (timer){ clearTimeout(timer); timer = null; }
    stopAuto();
    var c = chip, b = box, wasDrag = dragging;
    chip = null; box = null; dragging = false;
    zoneHide();
    document.body.classList.remove('chip-dragging');
    if (!c) return;
    c.classList.remove('dragging');

    var gid = c.getAttribute('data-gid');
    var gname = '';
    foodRegistry().forEach(function (g) { if (g.id === gid) gname = g.name; });

    if (!wasDrag){
      /* 长按进入编辑模式：顺手把这一颗选中（顶部「编辑」直接可用）。
         不拖动就不重排，也不退出编辑。 */
      if (S.ui.chipEdit && gid && S.ui.editGroup !== gid){
        var keepTopLP = c.getBoundingClientRect().top;
        S.ui.editGroup = gid; save(); render(); keepChipTop(gid, keepTopLP);
      }
      return;
    }

    if (inDrop(lastY)){
      if (S.ui.editGroup === gid) S.ui.editGroup = null;
      var isCustom = removeFoodGroup(gid);
      render();
      toast((isCustom ? trTxt('已删除') : trTxt('已隐藏')) + ' · ' + trTxt(gname));
      return;
    }
    if (!moved){                             /* 只是长按了一下：进入编辑模式并选中这一颗 */
      if (S.ui.chipEdit && S.ui.editGroup !== gid){ S.ui.editGroup = gid; save(); }
      render(); return;
    }

    var ids = [].slice.call(b.querySelectorAll('.food-chip')).map(function (el2) {
      return el2.getAttribute('data-gid');
    });
    var rest = (S.foodOrder || []).filter(function (g) { return ids.indexOf(g) < 0; });
    S.foodOrder = ids.concat(rest);
    save(); render(); toast('顺序已保存');
  }

  /* ---- 鼠标 / 触控笔 ---- */
  document.addEventListener('pointerdown', function (e) {
    if (e.button != null && e.button !== 0) return;
    if (e.pointerType === 'touch') return;
    begin(e.clientX, e.clientY, e.target);
  }, { passive: true });

  document.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    if (!chip) return;
    if (dragging && e.cancelable) e.preventDefault();
    move(e.clientX, e.clientY);
  }, { passive: false });

  document.addEventListener('pointerup', function (e) {
    if (e.pointerType === 'touch') return;
    finish();
  }, { passive: true });

  document.addEventListener('pointercancel', reset);

  /* ---- 触摸 ---- */
  document.addEventListener('touchstart', function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    begin(t.clientX, t.clientY, e.target);
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    var t = e.touches && e.touches[0];
    if (!t) return;
    if (!chip) return;
    if (dragging){ if (e.cancelable) e.preventDefault(); e.stopPropagation(); }
    move(t.clientX, t.clientY);
  }, { passive: false });

  document.addEventListener('touchend', function () { finish(); }, { passive: true });
  document.addEventListener('touchcancel', reset);

  /* 长按不弹系统菜单 */
  document.addEventListener('contextmenu', function (e) {
    if (e.target.closest && e.target.closest('.food-chip')) e.preventDefault();
  });
})();

/* ================= 编辑模式：点食材以外的地方就结束 ================= */
/* 只有点这几样才留在编辑模式：食材本身、右上角按钮、规格、已隐藏栏、编辑表单。
   点到页面其他地方（包括虚线框里的空白）都算改完了，直接退出。 */
document.addEventListener('click', function (e) {
  if (!S.ui.chipEdit) return;
  var t = e.target;
  if (t && t.closest && (t.closest('.food-chip') || t.closest('.chips-head') ||
      t.closest('.spec-row') || t.closest('.chip-bar') || t.closest('.addfood'))) return;
  S.ui.chipEdit = false;
  S.ui.editGroup = null;
  save();
  setTimeout(render, 0);      /* 等这次点击的其他处理跑完再重绘，避免打断输入框焦点 */
}, false);

/* ================= 今日摄入：长按拖动进度条 ================= */
/* 按住 1 s → 条变粗、震一下，之后横向拖动就是改「已吃」的数字；
   拖动中不重绘整页，只改当前这一行的数字 / 条 / 差额，松手才写状态并重绘。
   拖到最右 = 刚好达标；想再往上加就用旁边的加减按钮。 */
(function () {
  var HOLD = 1000;   /* 长按门槛：1 s */
  var SLOP = 10;     /* 还没到点就挪动超过这个距离，当作在滑页面，取消 */
  var cur = null;

  function cancelPress() {
    if (!cur) return;
    clearTimeout(cur.timer);
    if (cur.bar) cur.bar.classList.remove('pending');
    cur = null;
  }

  /* 手指（鼠标）位置 → 数值，按 1 或 5 的颗粒度取整 */
  function valAt(bar, x) {
    var r = bar.getBoundingClientRect();
    var tg = +bar.dataset.tg || 0;
    var min = +bar.dataset.min || 0;
    var step = +bar.dataset.step || 1;
    var raw = r.width ? (x - r.left) / r.width : 0;
    raw = Math.max(0, Math.min(1, raw));
    var v = Math.round(raw * tg / step) * step;
    return Math.max(min, Math.min(tg, v));
  }

  /* 滑块和气泡都按像素摆，并且夹在条里面 —— 否则 0% / 100% 时会多出半个滑块，
     把 <div class="bar"> 的 scrollWidth 撑大（页面横向滚动条的源头）。 */
  function place(bar, val) {
    var tg = +bar.dataset.tg || 0;
    var w = bar.clientWidth || 1;
    var x = tg ? Math.min(1, val / tg) * w : 0;
    var knob = bar.querySelector('.knob');
    if (knob) knob.style.left = Math.max(8, Math.min(w - 8, x)) + 'px';
    var tip = bar.querySelector('.bar-tip');
    if (tip) {
      tip.textContent = val + (bar.dataset.u ? ' ' + bar.dataset.u : '');
      var tw = tip.offsetWidth || 0;
      tip.style.left = (tw ? Math.max(tw / 2, Math.min(w - tw / 2, x)) : x) + 'px';
    }
  }

  function show(bar, val) {
    cur.val = val;
    var tg = +bar.dataset.tg || 0;
    var pct = tg ? Math.min(100, val / tg * 100) : 0;
    var fill = bar.querySelector('i');
    if (fill) { fill.style.width = pct + '%'; fill.classList.add('live'); }   /* 拖动中一律绿色 */
    place(bar, val);
    bar.setAttribute('aria-valuenow', val);

    var tr = bar.closest('tr');
    if (!tr) return;
    var inp = tr.querySelector('.m-in');
    if (inp) inp.value = val;
    var bv = tr.querySelector('.m-val');
    if (bv) bv.textContent = val;

    var gap = tg - val;
    var over = bar.dataset.limit === '1' ? val > tg : val > tg * 1.05;
    var cell = tr.querySelector('.m-gap');
    if (cell) {
      cell.textContent = Math.abs(gap) < 0.5 ? trTxt('达成') : (gap >= 0 ? '−' : '+') + Math.abs(Math.round(gap));
      cell.className = 'm-gap ' + (over ? 'gap-over' : 'gap-ok');
    }
  }

  function activate() {
    if (!cur) return;
    var bar = cur.bar;
    cur.active = true;
    bar.classList.remove('pending');
    bar.classList.add('dragging');
    try { bar.setPointerCapture(cur.id); } catch (e) {}
    if (navigator.vibrate) { try { navigator.vibrate(16); } catch (e) {} }   /* 安卓有，iOS 没有，忽略即可 */

    /* 只把当前值亮出来，不立刻跳到手指位置 —— 免得长按一下数字就变了 */
    var tg = +bar.dataset.tg || 0;
    var min = +bar.dataset.min || 0;
    var inp = bar.closest('tr').querySelector('.m-in, .m-val');
    var v = inp ? Math.round(parseFloat(inp.value != null ? inp.value : inp.textContent) || 0) : 0;
    var val = Math.max(min, Math.min(tg, v));
    place(bar, val);
  }

  function endPress() {
    if (!cur) return;
    var st = cur;
    cur = null;
    clearTimeout(st.timer);
    st.bar.classList.remove('dragging');
    if (!st.active || st.val == null) return;
    nutSetValue(st.bar.dataset.drag, st.val);
    save();
    render();
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var t = e.target;
    var bar = (t && t.closest) ? t.closest('.bar[data-drag]') : null;
    if (!bar) return;
    cancelPress();
    cur = { bar: bar, id: e.pointerId, x: e.clientX, y: e.clientY, active: false, val: null, timer: 0 };
    bar.classList.add('pending');
    cur.timer = setTimeout(activate, HOLD);
  }, { passive: true });

  document.addEventListener('pointermove', function (e) {
    if (!cur || e.pointerId !== cur.id) return;
    if (!cur.active) {
      if (Math.abs(e.clientX - cur.x) > SLOP || Math.abs(e.clientY - cur.y) > SLOP) cancelPress();
      return;
    }
    show(cur.bar, valAt(cur.bar, e.clientX));
  }, { passive: true });

  document.addEventListener('pointerup', function (e) {
    if (!cur || e.pointerId !== cur.id) return;
    if (!cur.active) { cancelPress(); return; }
    endPress();
  });

  document.addEventListener('pointercancel', function (e) {
    if (!cur || e.pointerId !== cur.id) return;
    endPress();
  });

  /* 长按别弹系统菜单 / 别选中文字 */
  document.addEventListener('contextmenu', function (e) {
    if (e.target && e.target.closest && e.target.closest('.bar')) e.preventDefault();
  });
})();

/* ================= 禁用双击放大 ================= */
/* CSS 的 touch-action:manipulation 已经能挡住大部分浏览器；iOS Safari（尤其网页版）对
   它支持不完整，所以再在 touchend 上兜一层：300 ms 内同一位置连点两次就拦掉缩放。
   例外：连点同一个按钮 / 输入框时不拦（那是故意操作，或双击选词），避免把连点吃掉。 */
(function(){
  var lastT = 0, lastX = 0, lastY = 0, lastEl = null;
  var TAP_SEL = 'button,a,label,input,select,textarea,[data-action],[contenteditable="true"]';

  function isTapTarget(node){
    if (!node || node.nodeType !== 1) return false;
    if (node.closest(TAP_SEL)) return true;
    var tag = node.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  }

  document.addEventListener('touchend', function (e){
    if (!e.cancelable) return;                    /* 已被别处 preventDefault */
    if (e.touches && e.touches.length) return;    /* 还有手指按着 → 可能是在缩放，不管 */
    var t = e.changedTouches && e.changedTouches[0];
    if (!t) return;
    /* 双指及以上（真正的捏合缩放）不处理 */
    if (e.changedTouches.length > 1) return;

    var now = Date.now();
    var sameEl = (lastEl === e.target);
    var near = Math.abs(t.clientX - lastX) < 26 && Math.abs(t.clientY - lastY) < 26;
    var dbl = (now - lastT) < 300 && near;

    if (dbl && !(sameEl && isTapTarget(e.target))){
      e.preventDefault();                          /* 吃掉这次 tap → 浏览器不缩放 */
      lastT = 0;
      return;
    }
    lastT = now; lastX = t.clientX; lastY = t.clientY; lastEl = e.target;
  }, { passive: false });
})();

/* ================= 新手指引 ================= */
/* 第一次打开、或指引内容更新过（V 变大）还没看过的人，走一遍聚光灯指引：
   四周压暗、只把要点的那一个控件留出来，除了它点不到别的地方。 */
var Guide = (function () {
  var V = 2;                       /* 改了指引内容就把这个数 +1，看过旧版的人会再看一遍 */
  function en(){ return S.lang === 'en'; }
  function pick(o){ return en() ? o.en : o.zh; }

  var STEPS = [
    { view:'templates', sel:'#goalSeg',
      t:{ zh:'先选一个健身目标', en:'Pick your goal first' },
      d:{ zh:'减脂、塑形、增肌、维持、提高精力、运动表现——点一个。热量、蛋白和碳水会照着这个目标整套重算。',
          en:'Cut, tone, bulk, maintain, energy or performance — tap one. Calories, protein and carbs are all recalculated around it.' } },
    { view:'templates', sel:'#cardMethodLib .mth',
      t:{ zh:'再挑一套训练法', en:'Then pick a training method' },
      d:{ zh:'按目标排好了，★ 就是你现在的目标。点「套用」会把分化方式、训练日和每肌群组数一次装进周计划。',
          en:'Sorted by goal — the ★ one matches yours. Tap Apply to load its split, training days and weekly set targets into the plan.' } },
    { view:'plugins', sel:'#packBox',
      t:{ zh:'身体数据不用一项项敲', en:'Skip typing your body data' },
      d:{ zh:'把体脂秤截图丢给 AI，让它照「提示词」生成文件；回来粘到这里点导入身体数据，自定义食材也可以那么添加。',
          en:'Send a smart-scale screenshot to an AI with the prompt, then paste the file it returns here and import your body data. Custom foods work the same way.' } },
    { view:'nutrition', sel:'#cardIntake .macro-table',
      t:{ zh:'吃了什么、还差什么', en:'What you ate, what is left' },
      d:{ zh:'左边记今天吃进去的，右边告诉你还差多少；上面那个环是今天的评分。长按进度条还能直接拖数值。',
          en:'Left side logs what you ate, right side shows what is still missing. The ring above is today’s score — long-press a bar to drag the number.' } },
    { view:'nutrition', sel:'#cardBalance .bal-list, #cardBalance .empty-tip',
      t:{ zh:'怎么补，让它算到克', en:'Let it work out the grams' },
      d:{ zh:'勾的食材都列在这儿，每样该吃多少克也写好了；点「自动配平」会按上面的缺口重算，点「全部清零」回到自己挑。',
          en:'Every food you ticked is listed with the grams that close the gap. Auto-balance recalculates from the numbers above; Clear all starts over.' } },
    { view:'week', sel:'#btnSetup',
      t:{ zh:'最后排自己的周计划', en:'Finally, build your week' },
      d:{ zh:'「排课设置」里定每周练几天、哪天休息；点日历上任意一天，就能改当天的动作。',
          en:'Use Set up week to choose training days and rest days; tap any day on the calendar to edit its exercises.' } }
  ];

  var i = -1, on = false, box = null, ring = null, card = null, t1 = 0, t2 = 0, ts = 0, tick = 0;

  /* 滚动是异步的：先同步画一次，再在 60 / 280 ms 各补一次，
     这样 rAF 被节流（后台标签、无头浏览器）时位置也不会错。 */
  function later(){
    clearTimeout(t1); clearTimeout(t2);
    t1 = setTimeout(paint, 60);
    t2 = setTimeout(paint, 280);
  }

  function build(){
    if (box) return;
    box = document.createElement('div');
    box.id = 'guide';
    box.innerHTML =
      '<div class="gd-r" data-gd="t"></div><div class="gd-r" data-gd="b"></div>' +
      '<div class="gd-r" data-gd="l"></div><div class="gd-r" data-gd="r"></div>' +
      '<div class="gd-ring"></div><div class="gd-card" role="dialog" aria-live="polite"></div>';
    document.body.appendChild(box);
    ring = box.querySelector('.gd-ring');
    card = box.querySelector('.gd-card');
  }

  function setR(k, x, y, w, h){
    var e = box.querySelector('[data-gd="' + k + '"]');
    if (!e) return;
    e.style.left = Math.round(x) + 'px';
    e.style.top = Math.round(y) + 'px';
    e.style.width = Math.max(0, Math.round(w)) + 'px';
    e.style.height = Math.max(0, Math.round(h)) + 'px';
  }

  function placeCard(atTop){
    card.style.left = '50%';
    if (atTop){ card.style.top = '16px'; card.style.bottom = 'auto'; }
    else { card.style.top = 'auto'; card.style.bottom = '16px'; }
  }

  function paint(){
    if (!on || i < 0) return;
    var vw = window.innerWidth, vh = window.innerHeight;
    var t = document.querySelector(STEPS[i].sel);
    var r = t ? t.getBoundingClientRect() : null;
    if (!r || (!r.width && !r.height)){
      setR('t', 0, 0, vw, vh); setR('b', 0, 0, 0, 0); setR('l', 0, 0, 0, 0); setR('r', 0, 0, 0, 0);
      ring.style.display = 'none';
      placeCard(false);
      return;
    }
    ring.style.display = '';
    var pad = 6;
    var L = Math.max(0, r.left - pad), T = Math.max(0, r.top - pad);
    var R = Math.min(vw, r.right + pad), B = Math.min(vh, r.bottom + pad);
    /* 高亮框最多占屏 60%，并且必须给说明卡片留出位置 ——
       否则手机上「今日摄入」那种比屏幕还高的目标，卡片会直接压在表格上。 */
    var cardH = (card && card.offsetHeight) || 170;
    var maxH = Math.min(vh * 0.6, Math.max(160, vh - cardH - 40));
    if (B - T > maxH) B = T + maxH;
    ring.style.left = Math.round(L) + 'px';
    ring.style.top = Math.round(T) + 'px';
    ring.style.width = Math.round(R - L) + 'px';
    ring.style.height = Math.round(B - T) + 'px';
    setR('t', 0, 0, vw, T);
    setR('b', 0, B, vw, vh - B);
    setR('l', 0, T, L, Math.max(0, B - T));
    setR('r', R, T, vw - R, Math.max(0, B - T));
    /* 卡片放在空间够的另一侧：下面够就放下，不够放上，两边都挤就挑大的那侧 */
    var below = vh - B - 12, above = T - 12;
    placeCard(below >= cardH ? false : (above >= cardH ? true : above > below));
  }

  function paintCard(){
    var st = STEPS[i];
    var dots = STEPS.map(function (_, k) { return '<i class="' + (k === i ? 'on' : '') + '"></i>'; }).join('');
    card.innerHTML =
      '<div class="gd-top"><span class="gd-step">' + (i + 1) + ' / ' + STEPS.length + '</span>' +
        '<span class="gd-dots">' + dots + '</span></div>' +
      '<h4>' + h(pick(st.t)) + '</h4><p>' + h(pick(st.d)) + '</p>' +
      '<div class="gd-btns">' +
        '<button class="btn sm ghost gd-skip" data-action="guideEnd">' + (en() ? 'Skip' : '跳过') + '</button>' +
        (i > 0 ? '<button class="btn sm ghost" data-action="guidePrev">' + (en() ? 'Back' : '上一步') + '</button>' : '') +
        '<button class="btn sm primary" data-action="guideNext">' +
          (i === STEPS.length - 1 ? (en() ? 'Got it' : '知道了') : (en() ? 'Next' : '下一步')) + '</button>' +
      '</div>';
  }

  function go(n){
    i = Math.max(0, Math.min(STEPS.length - 1, n));
    var st = STEPS[i], need = false;
    if (st.view){
      if (st.view === 'plugins'){ S.ui.plugTab = 'pack'; need = true; }   /* 第 3 步要落在「导入数据」这块 */
      if (S.ui.view !== st.view){ S.ui.view = st.view; save(); need = true; }
      if (need) render();
    }
    paintCard();
    var t = document.querySelector(st.sel);
    if (t && t.scrollIntoView){
      try { t.scrollIntoView({ block:'center', behavior:'auto' }); } catch (e) {}
    }
    paint();                          /* 先同步画一次，位置立刻正确 */
    later();                          /* 滚动落定后再校正 */
  }

  function start(){
    if (on) return;
    build();
    on = true;
    box.style.display = '';
    document.documentElement.classList.add('gd-on');
    go(0);
    /* 图片/字体/滚动条都会让目标挪位置，指引开着的时候持续跟着量（6 次/秒，很轻） */
    clearInterval(tick); tick = setInterval(paint, 160);
  }

  function end(){
    if (!on) return;
    on = false; i = -1;
    if (box) box.style.display = 'none';
    clearInterval(tick); tick = 0;
    document.documentElement.classList.remove('gd-on');
    S.ui.guide = { v: V, done: true };
    save();
  }

  function next(){ if (i >= STEPS.length - 1) return end(); go(i + 1); }
  function prev(){ if (i > 0) go(i - 1); }

  /* 重绘后目标节点被换掉了，重新量一次位置 */
  function sync(){ if (!on) return; paintCard(); paint(); later(); }

  window.addEventListener('resize', function () { if (on) paint(); });
  window.addEventListener('scroll', function () {
    if (!on) return;
    clearTimeout(ts); ts = setTimeout(paint, 40);
  }, true);

  return {
    start: start, next: next, prev: prev, end: end, sync: sync,
    active: function () { return on; },
    version: V,
    should: function () {
      var g = S.ui && S.ui.guide;
      return !g || +g.v < V;          /* 没走过，或者指引版本比看过的那个新 */
    }
  };
})();

/* 导航 */
document.addEventListener('click', function (e) {
  var b = e.target.closest('.nav-item');
  if (!b) return;
  S.ui.view = b.getAttribute('data-view');
  save(); render();
});

/* ================= 启动 ================= */
function init(){
  if (!S.water) S.water = {};
  if (typeof S.fs !== 'number' || S.fs < 1 || S.fs > 1.3) S.fs = 1.1;
  if (!S.ui.meals) S.ui.meals = 3;
  if (S.ui.meatBf == null) S.ui.meatBf = true;
  if (!S.mealsLog) S.mealsLog = {};
  if (!S.ui.nutDate) S.ui.nutDate = todayKey();
  if (!S.ui.guide) S.ui.guide = { v: 0, done: false };
  if (!Array.isArray(S.foodsOn)) S.foodsOn = ['chicken','beef','shrimp','carrot','cabbage_baby'];
  applyFs();
  render();
  el('lastSaved').textContent = trTxt('就绪');
  applyShellLang();
  syncFsBtn();
  /* 第一次打开、或者指引更新过还没看过的人，先走一遍 */
  if (Guide.should()){
    S.ui.view = 'templates'; save(); render();
    setTimeout(function () { Guide.start(); }, 220);
  }
}

function syncFsBtn(){
  var b = document.getElementById('fsBtn');
  if (b) b.title = trTxt('调整字号') + ' · ' + Math.round((S.fs || 1) * 100) + '%';
}
init();

/* 暴露给插件作者 */
window.RushFit = { state:S, save:save, render:render, registerPlugin:registerPlugin,
  body:function(){ return BM; }, targets:targets,
  rest:{ start:startRest, stop:stopRest, left:rtLeft },
  t:trTxt };
window.FitOS = window.RushFit;   // 旧名保留，避免老插件失效
window.RushFit.guide = Guide;      // 指引也可以手动重放：RushFit.guide.start()

/* PWA：注册 Service Worker，让「添加到主屏幕」后能离线打开 */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

})();

</script>
