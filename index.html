function builtPlan(wkKey){
  var w = S.weekly;
  var seq = SPLIT_SEQ[w.split] || SPLIT_SEQ.fb;
  var out = {};
  var i;
  for (i = 0; i < 7; i++) out[i] = { type:'rest' };
  w.days.slice(0, w.sessions).forEach(function (di, k) {
    var def = SESSION_DEFS[seq[k % seq.length]];
    if (!def) return;
    out[di] = {
      type:'train',
      title: def.name,
      tag: def.tag,
      exercises: def.exercises.map(function (e) { return { name:e.name, sets:e.sets, reps:e.reps, w:e.w }; })
    };
  });
  return out;
}

function planForWeek(wkKey){
  var base = builtPlan(wkKey);
  var ov = S.plans[wkKey] || {};
  Object.keys(ov).forEach(function (k) { base[k] = ov[k]; });
  return base;
}

function weekKeyOf(dateKey){ return iso(mondayOf(parse(dateKey))); }

function dayPlan(dateKey){
  var wk = weekKeyOf(dateKey);
  var plan = planForWeek(wk);
  return plan[dayIdxOf(dateKey)] || { type:'rest' };
}

function isTrainingDate(dateKey){ return dayPlan(dateKey).type === 'train'; }

/* 把某一天的改动写进计划覆盖层（否则重新渲染时会被自动生成的动作覆盖） */
function persistDay(dateKey, mutate){
  var wk = weekKeyOf(dateKey), di = dayIdxOf(dateKey);
  if (!S.plans[wk]) S.plans[wk] = {};
  var cur = S.plans[wk][di];
  if (!cur) cur = JSON.parse(JSON.stringify(dayPlan(dateKey)));
  if (!cur.exercises) cur.exercises = [];
  mutate(cur);
  S.plans[wk][di] = cur;
}

/* ---------- 训练容量：每肌群周组数 ---------- */
function muscleKeyOf(muscle){
  for (var i=0;i<MUSCLE_GROUPS.length;i++){
    if (MUSCLE_GROUPS[i].from.indexOf(muscle) >= 0) return MUSCLE_GROUPS[i].id;
  }
  return null;
}

/* 某个动作在计划里实际要做的组数（你在详情里加过组就用加过的） */
function plannedSetsOf(pe, dateKey){
  var n = pe.sets || 0;
  var log = S.logs[dateKey];
  if (log && log.items){
    for (var i=0;i<log.items.length;i++){
      if (log.items[i].name === pe.name){
        return Math.max(n, log.items[i].sets.length);
      }
    }
  }
  return n;
}

/* 一周每个肌群的 直接组 / 间接组 */
function weekMuscleMix(wkKey){
  var out = {};
  MUSCLE_GROUPS.forEach(function(g){ out[g.id] = { d:0, i:0 }; });
  weekDatesOf(parse(wkKey)).forEach(function(dk){
    var dp = dayPlan(dk);
    if (dp.type !== 'train') return;
    dp.exercises.forEach(function(pe){
      var n = plannedSetsOf(pe, dk);
      if (!n) return;
      var m = exMeta(pe.name);
      var k = muscleKeyOf(m.muscle);
      if (k && out[k]) out[k].d += n;
      var sec = PAT_SECONDARY[m.pat] || [];
      if (m.pat === 'hinge' && m.muscle === '臀') sec = [];
      sec.forEach(function(sid){ if (out[sid]) out[sid].i += n * 0.5; });
    });
  });
  return out;
}

function dayMuscleMix(dateKey){
  var out = {};
  MUSCLE_GROUPS.forEach(function(g){ out[g.id] = { d:0, i:0 }; });
  var dp = dayPlan(dateKey);
  if (dp.type !== 'train') return out;
  dp.exercises.forEach(function(pe){
    var n = plannedSetsOf(pe, dateKey);
    if (!n) return;
    var m = exMeta(pe.name);
    var k = muscleKeyOf(m.muscle);
    if (k && out[k]) out[k].d += n;
    var sec = PAT_SECONDARY[m.pat] || [];
    if (m.pat === 'hinge' && m.muscle === '臀') sec = [];
    sec.forEach(function(sid){ if (out[sid]) out[sid].i += n * 0.5; });
  });
  return out;
}

/* 有效组数 = 直接 + 0.5 × 间接 */
function effSets(mix){ return mix.d + mix.i * 0.5; }

/* 容量状态：low / ok / high */
function capState(eff, tg){
  if (!tg) return 'ok';
  if (eff < tg[0] - 0.01) return 'low';
  if (eff > tg[1] + 0.01) return 'high';
  return 'ok';
}

var FILLER_REPS = { calf:'12-15', core:'40 s', arm:'10-12', shoulder:'12-15', chest:'8-12', back:'8-12', quad:'10-12', post:'10-12' };

/* 按目标把本周组数补齐：先给已有动作加组（上限 4），不够再加一个动作 */
function fillVolume(wkKey){
  var pr = prescFor(S.goal);
  var dates = weekDatesOf(parse(wkKey));
  var added = 0, fails = [];
  MUSCLE_GROUPS.forEach(function(g){
    var tg = pr[g.id];
    if (!tg) return;
    var guard = 0;
    while (guard++ < 10){
      var mix = weekMuscleMix(wkKey);
      if (effSets(mix[g.id]) >= tg[0] - 0.01) return;
      /* 1) 已有该肌群动作，且组数 < 4 → 加一组 */
      var cand = null;
      dates.forEach(function(dk){
        var dp = dayPlan(dk);
        if (dp.type !== 'train') return;
        dp.exercises.forEach(function(e){
          if (muscleKeyOf(exMeta(e.name).muscle) !== g.id) return;
          if ((e.sets||0) >= 4) return;
          if (!cand || (e.sets||0) < cand.sets) cand = { date:dk, name:e.name, sets:e.sets||0 };
        });
      });
      if (cand){
        persistDay(cand.date, function(cur){
          cur.exercises.forEach(function(e){ if (e.name === cand.name) e.sets = (e.sets||0) + 1; });
        });
        added++;
        continue;
      }
      /* 2) 没有可用动作 → 在动作最少的那天加一个 2 组的动作 */
      var filler = MUSCLE_FILLER[g.id];
      var has = false;
      if (filler){
        dates.forEach(function(dk){
          (dayPlan(dk).exercises || []).forEach(function(e){ if (e.name === filler) has = true; });
        });
      }
      if (!filler || has){ fails.push(g.label); return; }
      var target = null;
      dates.forEach(function(dk){
        var dp = dayPlan(dk);
        if (dp.type !== 'train') return;
        if (!target || dp.exercises.length < target.n) target = { date:dk, n:dp.exercises.length };
      });
      if (!target){ fails.push(g.label); return; }
      var lp = lastPerf(filler, target.date);
      persistDay(target.date, function(cur){
        cur.exercises.push({ name:filler, sets:2, reps:FILLER_REPS[g.id] || '10-12',
          w: lp ? (lp.maxW || 0) : 0 });
      });
      added++;
    }
    fails.push(g.label);
  });
  return { added: added, fails: fails };
}

/* ================= 身体模型 ================= */
var BM = null;

function weekDatesOf(monday){ var a = []; for (var i=0;i<7;i++) a.push(iso(addDays(monday,i))); return a; }

function avgWeightIn(dates){
  var vals = dates.map(function (d) { return S.weights[d]; }).filter(function (v) { return typeof v === 'number' && v > 0; });
  if (!vals.length) return null;
  return vals.reduce(function (a,b){ return a+b; }, 0) / vals.length;
}

function weightSource(){
  var thisMon = mondayOf(new Date());
  var lastMon = addDays(thisMon, -7);
  var a = avgWeightIn(weekDatesOf(lastMon));
  if (a) return { w: r1(a), label:'上周均值', count: weekDatesOf(lastMon).filter(function(d){return S.weights[d];}).length };
  var keys = Object.keys(S.weights).filter(function(d){ return typeof S.weights[d]==='number'; }).sort();
  if (keys.length){
    var last = keys[keys.length-1];
    return { w: r1(S.weights[last]), label:'最近记录 ' + last.slice(5).replace('-', '/'), count:1 };
  }
  return { w: S.profile.weight, label:'手动输入', count:0 };
}

function computeBody(){
  var p = S.profile || {};
  var hCm = (typeof p.height === 'number' && p.height > 100) ? p.height : 170;
  var h = hCm / 100;
  var src = weightSource();
  var w = (src.w > 0) ? src.w : 70;
  var bf = (typeof p.bodyFat === 'number' && p.bodyFat > 0 && p.bodyFat < 60) ? p.bodyFat : null;
  var sex = (p.sex === 'female') ? 'female' : 'male';
  var bfGoal = (typeof p.bfGoal === 'number' && p.bfGoal > 0)
    ? p.bfGoal : (sex === 'female' ? 24 : 17);

  var fatMass = bf != null ? w * bf / 100 : null;
  var lbm = bf != null ? w - fatMass : null;

  var mifflin = 10 * w + 6.25 * hCm - 5 * (p.age || 21) + (p.sex === 'female' ? -161 : 5);
  var bmrCalc = lbm != null ? (370 + 21.6 * lbm) : mifflin;
  var bmr = (typeof p.bmr === 'number' && p.bmr > 0) ? p.bmr : bmrCalc;

  /* 活动拆成两项：日常活动（不练的时候走了多少、站了多久）+ 每周训练次数。
     久坐的人也可能一周练 5 次，旧版把这两件事绑在四档系数里，必然是错的。 */
  var neat = (typeof S.actNeat === 'number') ? S.actNeat : 1.25;
  var sess = Math.max(0, Math.min(6, (S.actSess == null ? 3 : S.actSess)));
  var sessAdd = 0.08 * sess;          // 每次训练对「日平均」的加成（≈ BMR × 8%）

  /* 训练日 / 休息日的拆分比例：保证一周总量守恒
     n 个训练日各多 x，7-n 个休息日各少 y，且 n·x = (7-n)·y */
  var nSess = Math.max(1, Math.min(6, sess || 3));   /* 上限 6：7 会让 (7-n) 变 0 */
  var share = sess > 0 ? 0.05 : 0;        // 训练日比周均高 5%
  var shareRest = sess > 0 ? nSess * share / (7 - nSess) : 0;

  var tdeeAvg, tdeeSrc, tdeeTrain, tdeeRest;
  if (S.actMode === 'watch' && S.watchTotal > 800){
    tdeeAvg = S.watchTotal;
    tdeeTrain = tdeeAvg * (1 + share);
    tdeeRest  = tdeeAvg * (1 - shareRest);
    tdeeSrc = '手表近 7 天均值';
  } else if (S.actMode === 'split'){
    var base = bmr * (S.neat || 1.25);
    tdeeTrain = base + (S.exKcal || 0);
    tdeeRest  = base;
    tdeeAvg   = (tdeeTrain * nSess + tdeeRest * (7 - nSess)) / 7;
    tdeeSrc = '静息 ' + Math.round(bmr) + ' × ' + (S.neat || 1.25) + ' ＋ 运动 ' + Math.round(S.exKcal || 0);
  } else {
    tdeeAvg = bmr * (neat + sessAdd);
    tdeeTrain = tdeeAvg * (1 + share);
    tdeeRest  = tdeeAvg * (1 - shareRest);
    tdeeSrc = 'BMR ' + Math.round(bmr) + ' × (' + neat + ' + ' + sessAdd.toFixed(2) + ')';
  }

  var missing = [];
  if (!p.height) missing.push('身高');
  if (bf == null) missing.push('体脂率');
  if (lbm == null) missing.push('瘦体重');
  if (!p.bmr) missing.push('基础代谢');

  return {
    weight: w, weightSrc: src, height: h, heightCm: hCm,
    bf: bf, fatMass: fatMass, lbm: lbm,
    sex: sex, bfGoal: bfGoal,
    bmr: bmr, bmrCalc: bmrCalc, mifflin: mifflin,
    tdee: tdeeAvg, tdeeAvg: tdeeAvg, tdeeTrain: tdeeTrain, tdeeRest: tdeeRest, tdeeSrc: tdeeSrc,
    actNeat: neat, actSess: sess, actAdd: sessAdd,
    planSess: (S.weekly && S.weekly.days) ? S.weekly.days.length : 0,
    ffmi: lbm != null ? lbm / (h*h) : null,
    ffmiAdj: lbm != null ? lbm/(h*h) + 6.1*(1.8-h) : null,
    fmi: fatMass != null ? fatMass / (h*h) : null,
    bmi: w / (h*h),
    missing: missing,
    complete: missing.length === 0
  };
}

/* 某一天实际用哪个 TDEE */
function tdeeFor(dateKey){
  return isTrainingDate(dateKey) ? BM.tdeeTrain : BM.tdeeRest;
}

function nv(v, d){ return (v == null || isNaN(v)) ? '—' : (d == null ? v : v.toFixed(d)); }

/* ================= 营养目标 ================= */
/* 碳水分配：
   split = 训练日高碳、休息日低碳（默认）
   flat  = 全周一致（按周均 TDEE，不再随训练日摆动）
   high  = 全周一致 + 脂肪压到 0.7 g/kg，剩下的热量全给碳水（约 5 g/kg） */
var CARB_MODES = {
  split: { label:'训练日高 / 休息日低', short:'训练日高碳' },
  flat:  { label:'全周一致',           short:'全周同碳' },
  high:  { label:'全周高碳（脂肪最低）', short:'全周高碳' }
};

/* ---------- 有氧运动 ---------- */
/* MET 来自 Compendium of Physical Activities，估算式：
   kcal = MET × 3.5 × 体重(kg) / 200 × 分钟 */
var CARDIO_TYPES = [
  { id:'tm_walk', name:'跑步机（快走 5.5）', met:3.8 },
  { id:'tm_run',  name:'跑步机（跑 8–10）',  met:8.3 },
  { id:'ellipt',  name:'椭圆机',             met:5.0 },
  { id:'stair',   name:'爬坡机 / 登山机',    met:9.0 },
  { id:'rower',   name:'划船机',             met:7.0 },
  { id:'bike',    name:'动感单车',           met:6.8 },
  { id:'rope',    name:'跳绳',               met:12.3 },
  { id:'outdoor', name:'户外快走',           met:4.3 }
];

function cardioType(id){
  for (var i = 0; i < CARDIO_TYPES.length; i++) if (CARDIO_TYPES[i].id === id) return CARDIO_TYPES[i];
  return CARDIO_TYPES[0];
}

function cardioEst(typeId, min, weightKg){
  var c = cardioType(typeId);
  var w = (weightKg > 0) ? weightKg : 70;
  return Math.max(0, Math.round(c.met * 3.5 * w / 200 * (min || 0)));
}

function cardioList(dk){ return (S.cardio && S.cardio[dk]) ? S.cardio[dk] : []; }
function cardioKcal(dk){
  var a = 0; cardioList(dk).forEach(function (x) { a += (+x.kcal || 0); }); return a;
}
function cardioMin(dk){
  var a = 0; cardioList(dk).forEach(function (x) { a += (+x.min || 0); }); return a;
}

function targets(dateKey){
  var g = GOALS[S.goal] || GOALS.energy;
  var tr = isTrainingDate(dateKey);
  var mode = S.carbMode || 'split';
  var dayTdee = tdeeFor(dateKey);
  var baseTdee = (mode === 'split') ? dayTdee : BM.tdeeAvg;
  var swing = (mode === 'split') ? (tr ? g.swingTrain : g.swingRest) : 0;
  var cardio = cardioKcal(dateKey);            // 当天的有氧消耗，100% 加回到目标
  var rawKcal = baseTdee * g.kcal + swing + cardio;
  var p = Math.round(BM.weight * g.proteinKg);
  var fatKg;
  if (mode === 'high') fatKg = 0.7;
  else if (mode === 'flat') fatKg = (g.fatTrain + g.fatRest) / 2;
  else fatKg = (tr ? g.fatTrain : g.fatRest);
  var fat = Math.round(BM.weight * fatKg);
  var c = Math.max(60, Math.round((rawKcal - p*4 - fat*9) / 4));
  var kcal = p*4 + fat*9 + c*4;
  return {
    kcal: kcal, p: p, fat: fat, c: c,
    sugar: Math.round(kcal * 0.10 / 4),
    fiber: Math.round(kcal / 1000 * 14),
    /* 钠：中国居民膳食指南建议食盐 < 5 g/天，约合钠 2000 mg。出汗多可放宽到 2300。 */
    sodium: 2000,
    tdee: Math.round(baseTdee + cardio),
    cardio: cardio,
    tr: tr, carbMode: mode,
    carbPerKg: BM.weight ? Math.round(c / BM.weight * 10) / 10 : 0
  };
}

function nutOf(dateKey){
  if (!S.nut[dateKey]) S.nut[dateKey] = { p:0, f:0, c:0, sugar:0, fiber:0, sodium:0 };
  var n = S.nut[dateKey];
  if (typeof n.sugar !== 'number') n.sugar = 0;
  if (typeof n.fiber !== 'number') n.fiber = 0;
  if (typeof n.sodium !== 'number') n.sodium = 0;
  return n;
}
function nutKcal(n){ return n.p*4 + n.f*9 + n.c*4; }

/* 直接写「已吃」的某一项（拖进度条、点加减都走这里）。
   热量没有独立字段，由蛋白/脂肪/碳水算出来 —— 拖热量就当改碳水，
   因为蛋白和脂肪的目标是固定的，碳水才是弹性项。 */
function nutSetValue(key, val){
  var n = nutOf(S.ui.nutDate);
  var v = Math.max(0, Math.round(val));
  if (key === 'kcal'){
    var rest = v - n.p * 4 - n.f * 9;
    n.c = Math.max(0, Math.round(rest / 4 * 10) / 10);
  } else if (key === 'sodium'){
    n.sodium = v;
  } else if (key === 'p' || key === 'f' || key === 'c' || key === 'sugar' || key === 'fiber'){
    n[key] = v;
  }
  return n;
}

/* 食物记录：每次「快速记录」追加一条，便于回看今天到底吃了什么 */
function mealsLogOf(dateKey){
  if (!S.mealsLog) S.mealsLog = {};
  if (!S.mealsLog[dateKey]) S.mealsLog[dateKey] = [];
  return S.mealsLog[dateKey];
}

/* ================= 训练日志 ================= */
function logOf(dateKey){
  if (!S.logs[dateKey]) S.logs[dateKey] = { items: [] };
  if (!S.logs[dateKey].items) S.logs[dateKey].items = [];
  return S.logs[dateKey];
}

function repMid(reps){
  var s = String(reps);
  var m = s.match(/(\d+)\s*-\s*(\d+)/);
  if (m) return Math.round((+m[1] + +m[2]) / 2);
  var n = s.match(/(\d+)/);
  return n ? +n[1] : 10;
}

function ensureLog(dateKey){
  var plan = dayPlan(dateKey);
  var log = logOf(dateKey);
  if (plan.type !== 'train') return log;
  plan.exercises.forEach(function (pe) {
    var it = null;
    for (var i = 0; i < log.items.length; i++){
      if (log.items[i].name === pe.name){ it = log.items[i]; break; }
    }
    if (!it){
      var lp = lastPerf(pe.name, dateKey);
      it = { name: pe.name, sets: [{
        w: lp ? (lp.maxW || null) : (pe.w || null),
        r: repMid(pe.reps),
        done: false
      }]};
      log.items.push(it);
    }
    if (!it.sets.length){
      it.sets.push({ w: pe.w || null, r: repMid(pe.reps), done:false });
    }
  });
  // 计划里已经没有的动作（被替换或删除）清掉，手动添加的保留
  log.items = log.items.filter(function (it) {
    return plan.exercises.some(function (pe) { return pe.name === it.name; }) || it.manual;
  });
  return log;
}

function dayProgress(dateKey){
  var plan = dayPlan(dateKey);
  if (plan.type !== 'train') return { done:0, total:0, pct:0 };
  var planTotal = plan.exercises.reduce(function (a,e){ return a + (e.sets||0); }, 0);
  var log = S.logs[dateKey];
  var done = 0;
  (log ? log.items : []).forEach(function (it) {
    it.sets.forEach(function (s) { if (s.done) done++; });
  });
  var total = Math.max(planTotal, done);
  return { done:done, total:planTotal, pct: planTotal ? Math.min(100, Math.round(done/planTotal*100)) : 0 };
}

function lastPerf(name, beforeDate){
  var dates = Object.keys(S.logs).filter(function (d) { return d < beforeDate; }).sort().reverse();
  for (var i = 0; i < dates.length; i++){
    var items = (S.logs[dates[i]].items || []);
    for (var j = 0; j < items.length; j++){
      var it = items[j];
      if (it.name !== name) continue;
      var done = it.sets.filter(function (s) { return s.done; });
      if (!done.length) continue;
      var maxW = 0, bestR = 0, vol = 0;
      done.forEach(function (s) {
        var w = +s.w || 0, rr = +s.r || 0;
        if (w > maxW) maxW = w;
        if (rr > bestR) bestR = rr;
        vol += w * rr;
      });
      return { date: dates[i], maxW: maxW, bestReps: bestR, vol: Math.round(vol), sets: done.length };
    }
  }
  return null;
}

function incFor(name){
  if (/深蹲|硬拉|腿举|臀|提踵|保加利亚|分腿/.test(name)) return 5;
  return 2.5;
}

function repTop(reps){
  var m = String(reps).match(/(\d+)\s*-\s*(\d+)/);
  if (m) return +m[2];
  var n = String(reps).match(/(\d+)/);
  return n ? +n[1] : 10;
}

/* ================= 食材注册表 ================= */
/* 内置食材的数值被改过时，用一份「覆盖层」贴回原对象。
   覆盖按 id 走，所以同一食物不同规格（牛肉·瘦 / 牛肉·肥）各自独立。 */
function withEdit(f){
  var e = (S.foodEdits || {})[f.id];
  if (!e) return f;
  var o = {};
  for (var k in f) if (Object.prototype.hasOwnProperty.call(f, k)) o[k] = f[k];
  for (var k2 in e) if (Object.prototype.hasOwnProperty.call(e, k2)) o[k2] = e[k2];
  return o;
}
function allFoods(){
  var cf = S.customFoods || [];
  var ef = S.foodEdits || {};
  if (!Object.keys(ef).length) return FOODS.concat(cf);
  return FOODS.map(withEdit).concat(cf);
}

/* 按 id 取任意食材（含自定义）——快速记录、配平、每日配额都走这里 */
function foodById(id){
  if (FOOD_MAP[id]) return withEdit(FOOD_MAP[id]);
  var cf = S.customFoods || [];
  for (var i = 0; i < cf.length; i++) if (cf[i].id === id) return cf[i];
  return null;
}

/* 从「参与配平的食材」里移除：自定义食材真删掉，内置食材只是隐藏（随时能恢复） */
function removeFoodGroup(gid){
  var isCustom = (S.customFoods || []).some(function (f) { return (f.group || f.id) === gid; });
  if (isCustom){
    S.customFoods = (S.customFoods || []).filter(function (f) { return (f.group || f.id) !== gid; });
    S.foodOrder = (S.foodOrder || []).filter(function (g) { return g !== gid; });
  } else {
    var hidArr = (S.foodHidden || []).slice();
    if (hidArr.indexOf(gid) < 0) hidArr.push(gid);
    S.foodHidden = hidArr;
  }
  S.foodsOn = S.foodsOn.filter(function (g) { return g !== gid; });
  /* 配平里这一项的克数与锁定一起清掉 */
  Object.keys(S.bal || {}).forEach(function (dk) {
    var rec = S.bal[dk]; if (!rec) return;
    if (rec.g) delete rec.g[gid];
    if (rec.locked) delete rec.locked[gid];
  });
  save();
  return isCustom;
}

function foodRegistry(){
  var reg = {}, order = [];
  allFoods().forEach(function(f){
    var g = f.group || f.id;
    if (!reg[g]){ reg[g] = { id:g, name:f.name, cat:f.cat, items:[] }; order.push(g); }
    reg[g].items.push(f);
  });
  var out = [];
  (S.foodOrder || []).forEach(function(g){ if (reg[g]){ out.push(reg[g]); delete reg[g]; } });
  order.forEach(function(g){ if (reg[g]) out.push(reg[g]); });
  return out;
}

function activeFoodFor(gid){
  var list = foodRegistry();
  for (var i=0;i<list.length;i++){
    if (list[i].id !== gid) continue;
    var vid = S.variants[gid];
    for (var j=0;j<list[i].items.length;j++){
      if (list[i].items[j].id === vid) return list[i].items[j];
    }
    return list[i].items[0];
  }
  return null;
}

function activeFoods(){
  return (S.foodsOn || []).map(activeFoodFor).filter(Boolean);
}

function foodLabel(f){
  return f.name + (f.variant ? '（' + f.variant + '）' : (f.desc ? ' · ' + f.desc : ''));
}

function foodOptionsHtml(){
  /* 顺序跟「参与配平的食材」完全一致：可见的按 foodOrder 排，隐藏的挪到最后 */
  var hid = S.foodHidden || [];
  var all = foodRegistry();
  var vis = all.filter(function (g) { return hid.indexOf(g.id) < 0; });
  var rest = all.filter(function (g) { return hid.indexOf(g.id) >= 0; });
  var pick = S.ui.qfFood || null;
  var out = '';
  vis.concat(rest).forEach(function(g){
    g.items.forEach(function(f){
      out += '<option value="' + f.id + '"' + (f.id === pick ? ' selected' : '') + '>' + h(foodLabel(f)) + '</option>';
    });
  });
  return out;
}

function macroOf(f, g){
  var r = g/100;
  return { p:(f.p||0)*r, f:(f.f||0)*r, c:(f.c||0)*r, kcal:(f.kcal||0)*r,
           fiber:(f.fiber||0)*r, sugar:(f.sugar||0)*r };
}

/* ================= 配平引擎（加权最小二乘 + 非负约束） ================= */
var BAL_KEYS = [
  { k:'p',     w:1.00, label:'蛋白' },
  { k:'c',     w:0.60, label:'碳水' },
  { k:'kcal',  w:0.45, label:'热量' },
  { k:'f',     w:0.32, label:'脂肪' },
  { k:'fiber', w:0.18, label:'纤维' }
];

function gapNow(dateKey){
  var t = targets(dateKey), n = nutOf(dateKey);
  return {
    t: t, n: n,
    p: t.p - n.p, f: t.fat - n.f, c: t.c - n.c,
    kcal: t.kcal - nutKcal(n), fiber: t.fiber - (n.fiber||0)
  };
}

function solveBalance(dateKey, force){
  var g0 = gapNow(dateKey);
  var foods = activeFoods();
  if (!foods.length) return { items: [], ok:false, reason:'empty', gap:g0, after:g0 };

  var rec = S.bal[dateKey] || (S.bal[dateKey] = { g:{}, locked:{}, solved:false });
  if (!rec.g) rec.g = {};
  if (!rec.locked) rec.locked = {};
  foods.forEach(function(f){ if (typeof rec.g[f.id] !== 'number') rec.g[f.id] = 0; });
  Object.keys(rec.g).forEach(function(id){
    if (!foods.some(function(f){ return f.id === id; })) delete rec.g[id];
  });

  var needSolve = force || !rec.solved;

  if (needSolve){
    var vars = [], fixed = { p:0, f:0, c:0, kcal:0, fiber:0 };
    foods.forEach(function(f){
      if (rec.locked[f.id]){
        var m = macroOf(f, rec.g[f.id] || 0);
        fixed.p += m.p; fixed.f += m.f; fixed.c += m.c; fixed.kcal += m.kcal; fixed.fiber += m.fiber;
      } else vars.push(f);
    });

    /* 每个营养素的目标与尺度 */
    var rows = BAL_KEYS.map(function(k){
      var tv = Math.max(0, g0[k.k] || 0);
      var scale = (k.k === 'kcal') ? Math.max(200, tv) : Math.max(5, tv);
      return { k:k.k, w:k.w, scale:scale, target:tv };
    });

    var pCap = Math.max(0, g0.p) + 2;   /* 蛋白只允许四舍五入带来的 2 g 余量 */

    /* 固定起点：未锁定的一律从 0 出发。
       同样的输入必然得到同样的输出，反复点「自动配平」不会再漂。 */
    var x = vars.map(function(){ return 0; });

    function totalsOf(v){
      var t = { p:fixed.p, f:fixed.f, c:fixed.c, kcal:fixed.kcal, fiber:fixed.fiber };
      for (var j2=0;j2<vars.length;j2++){
        var q = v[j2]; if (!q) continue;
        var r2 = q/100, f2 = vars[j2];
        t.p += (f2.p||0)*r2; t.f += (f2.f||0)*r2; t.c += (f2.c||0)*r2;
        t.kcal += (f2.kcal||0)*r2; t.fiber += (f2.fiber||0)*r2;
      }
      return t;
    }

    function costOf(v){
      var t = totalsOf(v), c = 0;
      for (var i4=0;i4<rows.length;i4++){
        var e = (t[rows[i4].k] - rows[i4].target) / rows[i4].scale;
        c += rows[i4].w * e * e;
      }
      if (t.p > pCap){
        var op = (t.p - pCap) / Math.max(10, rows[0].target);
        c += 6 * op * op;                       // 蛋白超标的硬惩罚
      }
      for (var j3=0;j3<vars.length;j3++){
        var u = v[j3] / (vars[j3].max || 500);
        c += 0.018 * u * u;                     // 抑制"一种食材吃到上限"
      }
      return c;
    }

    /* 每个坐标上成本都是凸的，用三分搜索取极小；收敛到位移 < 0.02 g 为止 */
    for (var sweep=0; sweep<60; sweep++){
      var moved = 0;
      for (var i2=0;i2<vars.length;i2++){
        var lo = 0, hi = vars[i2].max || 500, old2 = x[i2], m1, m2, c1, c2;
        for (var it2=0; it2<48; it2++){
          m1 = lo + (hi-lo)/3; m2 = hi - (hi-lo)/3;
          x[i2] = m1; c1 = costOf(x);
          x[i2] = m2; c2 = costOf(x);
          if (c1 < c2) hi = m2; else lo = m1;
        }
        x[i2] = (lo + hi) / 2;
        moved = Math.max(moved, Math.abs(x[i2] - old2));
      }
      if (moved < 0.02) break;
    }

    /* 先圆整到份量网格，再在网格内做坐标修复，保证结果就是网格上的最优点 */
    var stepOf = function(f){ return ((f.max||500) <= 60) ? 1 : 5; };
    var vec = vars.map(function(f, k){ return Math.max(0, Math.round(x[k]/stepOf(f))*stepOf(f)); });
    for (var gp2=0; gp2<4; gp2++){
      var better = false;
      for (var i3=0;i3<vars.length;i3++){
        (function(idx){
          var st = stepOf(vars[idx]), cur = vec[idx];
          var bestV = cur, bestC = costOf(vec);
          [cur - st, cur + st].forEach(function(cand){
            if (cand < 0 || cand > (vars[idx].max || 500)) return;
            vec[idx] = cand;
            var c = costOf(vec);
            if (c < bestC - 1e-12){ bestC = c; bestV = cand; }
          });
          vec[idx] = bestV;
          if (bestV !== cur) better = true;
        })(i3);
      }
      if (!better) break;
    }

    vars.forEach(function(f, k){ rec.g[f.id] = vec[k]; });
    rec.solved = true;
  }

  var ach = { p:0, f:0, c:0, kcal:0, fiber:0, sugar:0 };
  foods.forEach(function(f){
    var m = macroOf(f, rec.g[f.id] || 0);
    ach.p += m.p; ach.f += m.f; ach.c += m.c; ach.kcal += m.kcal; ach.fiber += m.fiber; ach.sugar += m.sugar;
  });

  var after = {
    p: g0.p - ach.p, f: g0.f - ach.f, c: g0.c - ach.c,
    kcal: g0.kcal - ach.kcal, fiber: g0.fiber - ach.fiber
  };

  /* 诊断：配平后哪些项仍然差得多（说明已选食材拉满也不够） */
  var missing = [];
  if (after.c > 40) missing.push({ cat:'carb', label:'主食' });
  if (after.f > 10) missing.push({ cat:'fat', label:'油脂' });
  if (after.p > 20) missing.push({ cat:'protein', label:'蛋白类' });
  if (after.fiber > 10) missing.push({ cat:'veg', label:'蔬菜' });

  return {
    items: foods.map(function(f){ return { food:f, g: rec.g[f.id] || 0, locked: !!rec.locked[f.id] }; }),
    achieved: ach, after: after, gap: g0, ok:true, missing: missing
  };
}

function portionPlan(dateKey){
  var t = targets(dateKey);
  var meals = S.ui.meals || 3;
  var meat = activeFoodFor(S.ui.meat) || FOOD_MAP.chicken_raw;
  var carb = activeFoodFor(S.ui.carb) || FOOD_MAP.rice;
  var mp = Math.max(meat.p, 1), cp = Math.max(carb.c, 1);
  /* 早餐不吃肉时，肉类只分到其余餐次，每餐克数自然变大；总蛋白目标不变 */
  var meatBf = S.ui.meatBf !== false;
  var meatMeals = meatBf ? meals : Math.max(1, meals - 1);
  return {
    meat: Math.max(30, Math.round((t.p*0.70/meatMeals) / (mp/100) / 10) * 10),
    meatFood: meat,
    meatMeals: meatMeals,
    meatBf: meatBf,
    carb: Math.max(30, Math.round((t.c*0.55/meals) / (cp/100) / 10) * 10),
    carbFood: carb,
    oil: Math.max(5, Math.round(t.fat*0.40)),
    sugar: t.sugar,
    meals: meals
  };
}

/* 休息计时器
   三个关键点：
   1. 用「结束时间戳」而不是递减计数 —— 后台被节流时回来仍是正确剩余时间
   2. 计时期间申请 Wake Lock，屏幕不自动熄灭（移动端后台挂起的主因）
   3. 音频在用户手势里解锁；结束时 <audio> + AudioContext 双保险
*/

var RT = { endAt: 0, total: 0, tick: null, lock: null };

function fmtSec(v){
  v = Math.max(0, Math.round(v || 0));
  var m = Math.floor(v/60), s = v % 60;
  return m + ':' + pad(s);
}

function rtLeft(){
  if (!RT.endAt) return 0;
  return Math.max(0, Math.ceil((RT.endAt - Date.now()) / 1000));
}

function paintRest(){
  var left = rtLeft();
  var a = document.getElementById('rtClock'); if (a) a.textContent = fmtSec(left);
  var b = document.getElementById('rbClock'); if (b) b.textContent = fmtSec(left);
  var bar = document.getElementById('restBar');
  if (bar) bar.classList.toggle('on', left > 0);
}

function tickClock(){ paintRest(); }
function restBarSync(){ paintRest(); }

/* ---------- 提示音：运行时生成一段 880Hz 三连短音，不依赖外部文件 ---------- */
var BEEP_URL = null;
function beepUrl(){
  if (BEEP_URL) return BEEP_URL;
  try {
    var sr = 8000, n = Math.round(sr * 0.90), bytes = 44 + n * 2;
    var buf = new ArrayBuffer(bytes), dv = new DataView(buf);
    function wr(off, str){ for (var q = 0; q < str.length; q++) dv.setUint8(off + q, str.charCodeAt(q)); }
    wr(0, 'RIFF'); dv.setUint32(4, bytes - 8, true); wr(8, 'WAVE');
    wr(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, sr, true); dv.setUint32(28, sr * 2, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    wr(36, 'data'); dv.setUint32(40, n * 2, true);
    for (var i2 = 0; i2 < n; i2++){
      var t = i2 / sr, seg = t % 0.30, v = 0;
      if (seg < 0.17){
        var atk = Math.min(1, seg / 0.008);
        var rel = Math.max(0, 1 - Math.max(0, seg - 0.11) / 0.06);
        v = Math.sin(2 * Math.PI * 880 * t) * 0.62 * atk * rel;
      }
      dv.setInt16(44 + i2 * 2, Math.max(-1, Math.min(1, v)) * 32767, true);
    }
    BEEP_URL = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  } catch (e) { BEEP_URL = null; }
  return BEEP_URL;
}

function beepCtx(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    var ctx = window.__ac || (window.__ac = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    for (var n2 = 0; n2 < 3; n2++){
      var t0 = ctx.currentTime + n2 * 0.32;
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001, t0);
      o.start(t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.20);
      o.stop(t0 + 0.22);
    }
  } catch (e) {}
}

function beep(){
  var url = beepUrl();
  if (url){
    try {
      if (!window.__beepEl) window.__beepEl = new Audio(url);
      var a = window.__beepEl;
      a.volume = 1; a.currentTime = 0;
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function () { beepCtx(); });
      else beepCtx();
      return;
    } catch (e) {}
  }
  beepCtx();
}

/* 第一次点击是用户手势，这里把音频解锁（iOS 必须） */
function unlockAudio(){
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !window.__ac) window.__ac = new AC();
    if (window.__ac && window.__ac.state === 'suspended') window.__ac.resume();
  } catch (e) {}
  var u = beepUrl();
  if (!u) return;
  try {
    if (!window.__beepEl) window.__beepEl = new Audio(u);
    var a = window.__beepEl;
    a.volume = 0.001;
    var pr = a.play();
    if (pr && pr.then) pr.then(function () { a.pause(); a.currentTime = 0; a.volume = 1; })
                        .catch(function () { a.volume = 1; });
    else a.volume = 1;
  } catch (e) {}
}

/* 计时期间屏幕常亮：这是「后台能跑」最实际的解法 */
function wakeOn(){
  try {
    if (!('wakeLock' in navigator) || RT.lock) return;
    navigator.wakeLock.request('screen').then(function (l) {
      RT.lock = l;
      l.addEventListener('release', function () { RT.lock = null; });
    }).catch(function () {});
  } catch (e) {}
}
function wakeOff(){
  try { if (RT.lock){ var l = RT.lock; RT.lock = null; l.release(); } } catch (e) {}
}

function buzz(p){
  try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {}
}

function notifyRest(){
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    if (document.visibilityState === 'visible') return;
    new Notification('休息结束', { body: '可以开始下一组了', tag: 'rushfit-rest' });
  } catch (e) {}
}
function askNotify(){
  try {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') Notification.requestPermission();
  } catch (e) {}
}

function finishRest(){
  wakeOff();
  beep(); buzz([200, 90, 200, 90, 200]);
  notifyRest();
  toast('休息结束，可以开始了');
}

function rtTick(){
  if (!RT.endAt) return;
  if (rtLeft() <= 0){
    RT.endAt = 0;
    if (RT.tick){ clearInterval(RT.tick); RT.tick = null; }
    paintRest();
    finishRest();
    return;
  }
  paintRest();
}

function startRest(sec){
  sec = Math.max(5, Math.min(900, +sec || 90));
  unlockAudio(); wakeOn(); askNotify();
  RT.endAt = Date.now() + sec * 1000;
  RT.total = sec;
  if (RT.tick) clearInterval(RT.tick);
  RT.tick = setInterval(rtTick, 250);
  buzz(14);
  paintRest();
}

function stopRest(){
  RT.endAt = 0;
  if (RT.tick){ clearInterval(RT.tick); RT.tick = null; }
  wakeOff();
  paintRest();
}

/* 回到前台立刻按时间戳重算；并重新申请 Wake Lock（切走会被系统释放） */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible'){
    if (RT.endAt){ rtTick(); wakeOn(); }
  }
});
window.addEventListener('pageshow', function () { if (RT.endAt) rtTick(); });
window.addEventListener('focus', function () { if (RT.endAt) rtTick(); });

  }
  html += '</div>';
  html += '</div></div>';
  return html;
}

/* ---------- 选课面板 ---------- */
function pickSessionSheet(){
  var pk = S.ui.pickSession;
  if (!pk) return '';
  var wk = weekKeyOf(pk.date);
  var plan = planForWeek(wk);
  var used = {}, nTrain = 0;
  for (var i=0;i<7;i++){
    var p = plan[i];
    if (p && p.type === 'train'){ used[p.title] = (used[p.title]||0) + 1; nTrain++; }
  }
  var best = null, bestN = 99;
  Object.keys(SESSION_DEFS).forEach(function(k){
    var n = used[SESSION_DEFS[k].name] || 0;
    if (n < bestN){ bestN = n; best = k; }
  });

  var d = parse(pk.date);
  var out = '<div class="sheet-mask" data-action="closeSheet"></div><div class="sheet">';
  out += '<div class="sheet-hd"><div><h4>这节课练什么</h4>' +

         ' · 本周已有 ' + nTrain + ' 个训练日</span></div>' +
         '<button class="btn icon" data-action="closeSheet">' + svgX() + '</button></div>';
  out += '<div class="sheet-bd">';

  [['fb','全身 A/B 交替'],['ul','上下肢分化'],['ppl','推 / 拉 / 腿']].forEach(function(grp){
    (SPLIT_SEQ[grp[0]] || []).forEach(function(key){
      var def = SESSION_DEFS[key];

      out += '<div class="sess-sec"><div class="sheet-t">' + grp[1] + '</div>';

             '<span class="sess-x">' + def.exercises.slice(0,4).map(function(e){ return h(e.name); }).join(' · ') +
             (def.exercises.length>4?' 等':'') + '</span></button>';

/* ================= 视图：营养 ================= */
/* 营养评分：吃少、吃多都扣分，权重按对训练结果的影响排。
   满分区间参考：蛋白 0.9–1.5×，热量 ±8%，碳水 0.8–1.25×，脂肪 0.75–1.35×，纤维 ≥0.8×，钠 ≤1×。 */
function nutScore(dk){
  var t = targets(dk), n = nutOf(dk);
  var kcal = nutKcal(n);
  if (kcal < 50 && !n.p && !n.c && !n.f) return null;

  function band(x, lo, hi, zeroLo, zeroHi){
    if (x >= lo && x <= hi) return 1;
    if (x < lo) return Math.max(0, Math.min(1, (x - zeroLo) / Math.max(0.001, lo - zeroLo)));
    return Math.max(0, Math.min(1, (zeroHi - x) / Math.max(0.001, zeroHi - hi)));
  }
  function ratio(v, tg){ return v / Math.max(tg, 1); }

  var rp = ratio(n.p, t.p), rk = ratio(kcal, t.kcal), rc = ratio(n.c, t.c);
  var rf = ratio(n.f, t.fat), rfib = ratio(n.fiber, t.fiber), rna = ratio(n.sodium, t.sodium);

  var items = [
    { k:'蛋白', w:30, r:rp,   s:band(rp,   0.90, 1.50, 0.20, 2.60) },
    { k:'热量', w:25, r:rk,   s:band(rk,   0.92, 1.08, 0.55, 1.50) },
    { k:'碳水', w:15, r:rc,   s:band(rc,   0.80, 1.25, 0.35, 1.80) },
    { k:'脂肪', w:15, r:rf,   s:band(rf,   0.75, 1.35, 0.30, 2.20) },
    { k:'纤维', w:10, r:rfib, s:band(rfib, 0.80, 2.00, 0.00, 4.00) }
  ];
  /* 钠：始终显示。没记录时标「未记录」且不计权重：
     既不会因为没填而白拿满分，也不会让这一行突然消失、让人以为漏算。 */
  var naRec = n.sodium > 0;
  items.push({ k:'钠', w:5, r:rna, s: naRec ? band(rna, 0.00, 1.00, -1.00, 1.60) : null });

  var got = 0, sumW = 0;
  items.forEach(function(x){ if (x.s === null) return; got += x.s * x.w; sumW += x.w; });
  var score = sumW ? Math.round(got / sumW * 100) : 0;
  var lv = score >= 90 ? '优秀' : score >= 75 ? '良好' : score >= 60 ? '一般' : '待改善';

  var scored = items.filter(function(x){ return x.s !== null; });
  var worst = scored.slice().sort(function(a, b){ return a.s - b.s; })[0];
  var note;
  if (worst.s >= 0.95) note = '各项都在目标附近，保持住就行。';
  else if (worst.r < 0.05) note = worst.k + '今天几乎没吃，这是拉低分数的主因。';
  else if (worst.r < 1) note = '最需要补 ' + worst.k + '，现在只完成 ' + Math.round(worst.r * 100) + '%。';
  else note = '最需要控制 ' + worst.k + '，已经到目标的 ' + Math.round(worst.r * 100) + '%。';

  return { score: score, lv: lv, items: items, note: note };
}

function scoreRingHtml(score){
  var R = 52, C = 2 * Math.PI * R, ARC = C * 0.75;
  var len = ARC * Math.max(0, Math.min(1, score / 100));
  return '<svg viewBox="0 0 126 126" role="img" aria-label="' + score + ' / 100">' +
    '<defs><linearGradient id="sgGrad" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#4f6ef7"/><stop offset="0.55" stop-color="#7b95fb"/><stop offset="1" stop-color="#aac8f9"/>' +
    '</linearGradient></defs>' +
    '<g transform="rotate(225 63 63)" fill="none" stroke-linecap="round">' +
      '<circle cx="63" cy="63" r="' + R + '" stroke="#eceef2" stroke-width="11" stroke-dasharray="' + ARC.toFixed(1) + ' ' + C.toFixed(1) + '"/>' +
      (score > 0 ? '<circle cx="63" cy="63" r="' + R + '" stroke="url(#sgGrad)" stroke-width="11" stroke-dasharray="' + len.toFixed(1) + ' ' + C.toFixed(1) + '"/>' : '') +
    '</g>' +
    (score > 0 ? '<circle cx="26.2" cy="26.2" r="5" fill="#3f5ef5"/>' : '') +
  '</svg>';
}

/* 鼓励语：按分数分档，同一天内固定（用日期做种子），不会每次重绘都跳。
   六项分数条已去掉：环形已经给了总分，分项明细在下方「今日摄入」表里都有。 */
var CHEER = {
  hi:   ['漂亮，今天很稳。', '满分节奏，别改。', '这状态，保持住就行。'],
  mid:  ['不错，就差一点。', '大方向对了，收个尾。', '再补一点就到满分。'],
  ok:   ['加油，还差一口气。', '及格了，往前挪一步。', '差的不多，补上就行。'],
  low:  ['今天先这样，明天补回来。', '别急，先吃口饭。', '记录比分数重要，继续。']
};
function cheerFor(score, dk){
  var arr = score >= 90 ? CHEER.hi : score >= 75 ? CHEER.mid : score >= 60 ? CHEER.ok : CHEER.low;
  var s = String(dk || ''), seed = 0;
  for (var i = 0; i < s.length; i++) seed = (seed * 31 + s.charCodeAt(i)) % 9973;
  return arr[seed % arr.length];
}

function scoreCardHtml(dk){
  var sc = nutScore(dk);
  var out = '<div class="card" style="margin-bottom:16px"><div class="card-bd">';
  if (!sc){
    out += '<div class="score-card">' +
      '<div class="score-ring">' + scoreRingHtml(0) + '<div class="score-num"><b style="color:var(--ink-3)">—</b><span>/ 100</span></div></div>' +
      '<div class="score-side"><div class="score-lv">今天还没有记录</div>' +
      '<div class="score-note">加一条就能出分。</div></div>' +
      '</div></div></div>';
    return out;
  }
  out += '<div class="score-card">' +
    '<div class="score-ring">' + scoreRingHtml(sc.score) + '<div class="score-num"><b>' + sc.score + '</b><span>/ 100</span></div></div>' +
    '<div class="score-side"><div class="score-lv">营养评分 · ' + sc.lv + '</div>' +
    '<div class="score-cheer">' + cheerFor(sc.score, dk) + '</div>' +
    '<div class="score-note">' + sc.note + '</div>' +
    '</div></div></div>';

}

  html += '<div class="field"><label>碳水分配</label><select class="input" data-field="carbMode">' +
    Object.keys(CARB_MODES).map(function(k){

function balanceResultHtml(bal){
  var a = bal.after;
  var rows = [
    { k:'蛋白', v:a.p, u:'g', tol:5 },
    { k:'碳水', v:a.c, u:'g', tol:10 },
    { k:'热量', v:a.kcal, u:'kcal', tol:60 },
    { k:'脂肪', v:a.f, u:'g', tol:5 },
    { k:'纤维', v:a.fiber, u:'g', tol:4 }
  ];
  var out = '<div class="bal-result"><span class="br-label">配平后：</span>';
  rows.forEach(function (r) {
    var v = Math.round(r.v);
    var cls = Math.abs(v) <= r.tol ? 'ok' : (v > 0 ? 'under' : 'over');
    var txt = Math.abs(v) <= r.tol ? '刚好' : (v > 0 ? '还差 ' + v + ' ' + r.u : '超 ' + (-v) + ' ' + r.u);
    out += '<span class="pill ' + cls + '">' + r.k + ' ' + txt + '</span>';
  });
  out += '</div>';
  return out;
}

    var on = S.foodsOn.indexOf(g.id) >= 0;
    var act = activeFoodFor(g.id);
    var vn = (g.items.length > 1 && act && act.variant) ? '<span class="chip-vn">' + h(act.variant) + '</span>' : '';
    out += '<button type="button" class="food-chip' + (on ? ' on' : '') + (edit && sel === g.id ? ' sel' : '') +
           '" data-action="toggleFood" data-id="' + g.id + '" data-gid="' + g.id + '" aria-pressed="' + on + '">' +
           h(g.name) + vn + '</button>';
  });
  out += '</div>';

  if (edit) out += '<div class="chip-tip">点食材选中 · 拖动排序 · 拖到顶部删除 · 点空白处结束</div>';

  if (hid.length){
    out += '<div class="chip-bar"><span class="chip-hidden">已隐藏 ' + hid.length + ' 种食材</span>' +
           '<button class="btn sm ghost" data-action="restoreHidden">恢复全部</button></div>';
  }

  /* 规格单独一行，大按钮，不再嵌在 chip 里 */
  var multi = reg.filter(function (g) { return g.items.length > 1 && S.foodsOn.indexOf(g.id) >= 0; });
  if (multi.length){
    out += '<div class="spec-row"><span class="spec-lbl">规格</span>';
    multi.forEach(function (g) {
      var act = activeFoodFor(g.id);
      out += '<span class="spec-grp"><span class="spec-name">' + h(g.name) + '</span>';
      g.items.forEach(function (f) {
        out += '<button type="button" class="spec-btn' + (act && act.id === f.id ? ' on' : '') + '"' +
               ' data-action="setVariant" data-group="' + g.id + '" data-vid="' + f.id + '">' +
               h(f.variant || '默认') + '</button>';
      });
      out += '</span>';
    });
    out += '</div>';
  }
  return out + '</div>';
}

function addFoodHtml(){
  var eid = S.ui.editFoodId || null;
  var src = eid ? foodById(eid) : null;
  if (!src) eid = null;
  var nn = function (v) {
    if (typeof v !== 'number' || !isFinite(v)) return '0';
    return String(Math.round(v * 10) / 10);
  };
  var v = function (k) { return src ? nn(src[k]) : '0'; };

  /* 同一食物有多个规格时，说明这次只改其中一种 */
  var specNote = '';
  if (src && src.group){
    var grp = foodRegistry().filter(function (g) { return g.id === src.group; })[0];
    if (grp && grp.items.length > 1){
      specNote = '<p class="af-note">' + (S.lang === 'en'
        ? 'Only this spec: <b>' + h(src.name) + (src.variant ? ' · ' + h(src.variant) : '') + '</b>. Other specs stay as they are.'
        : '只改这一种规格：<b>' + h(src.name) + (src.variant ? ' · ' + h(src.variant) : '') + '</b>，其他规格不受影响。') + '</p>';
    }
  }

  var out = '<div class="addfood">';
  out += '<div class="mgr-head">' + (eid
    ? '编辑食材（保存后覆盖原来这一条）'
    : '自定义食材（填每 100 g 的营养，包装上都有）') + '</div>';
  out += specNote;
  out += '<div class="form-grid">';
  out += '<div class="field full"><label>名称</label><input class="input" id="nfName" value="' + h(src ? src.name : '') + '" placeholder="例如：鸡胸肉罐头 / 食堂红烧肉"></div>';
  out += '<div class="field"><label>蛋白 g</label><input class="input num" id="nfP" type="number" step="0.1" value="' + v('p') + '"></div>';
  out += '<div class="field"><label>脂肪 g</label><input class="input num" id="nfF" type="number" step="0.1" value="' + v('f') + '"></div>';
  out += '<div class="field"><label>碳水 g</label><input class="input num" id="nfC" type="number" step="0.1" value="' + v('c') + '"></div>';
  out += '<div class="field"><label>糖 g</label><input class="input num" id="nfS" type="number" step="0.1" value="' + v('sugar') + '"></div>';
  out += '<div class="field"><label>纤维 g</label><input class="input num" id="nfFi" type="number" step="0.1" value="' + v('fiber') + '"></div>';
  out += '<div class="field"><label>钠 mg</label><input class="input num" id="nfNa" type="number" step="1" value="' + v('na') + '"></div>';
  out += '<div class="field"><label>热量 kcal</label><input class="input num" id="nfK" type="number" step="1" value="' + v('kcal') + '"></div>';
  out += '</div>';
  out += '<div class="bal-actions"><button class="btn primary" data-action="saveFood">' +
         (eid ? '保存修改' : '保存') + '</button>' +
         '<button class="btn" data-action="toggleAddFood">取消</button>' +
         '<span class="src">热量留空会按 4/9/4 估算</span></div>';
  out += '</div>';
  return out;
}

/* ================= 视图：身体模型 ================= */
function viewBody(){
  var p = S.profile;
  var b = BM;
  var src = b.weightSrc;

  var html = '';
  html += '<div class="body-grid">';

  /* 左：输入 */
  html += '<div class="card"><div class="card-hd"><h3>身体数据</h3><span class="hint">改完立即重算</span></div><div class="card-bd">';
  html += '<div class="form-grid">';
  html += '<div class="field"><label>性别</label><select class="input" data-field="sex">' +
    '<option value="male"' + (p.sex !== 'female' ? ' selected' : '') + '>男性</option>' +
    '<option value="female"' + (p.sex === 'female' ? ' selected' : '') + '>女性</option>' +
    '</select></div>';
  html += fieldNum('体重', 'weight', p.weight, 'kg', 'step="0.1"');
  html += fieldNum('体脂率', 'bodyFat', p.bodyFat, '%', 'step="0.1"');
  html += fieldNum('体脂目标', 'bfGoal', p.bfGoal, '%', 'step="0.5"');
  html += fieldNum('肌肉量', 'muscleMass', p.muscleMass, 'kg', 'step="0.1"');
  html += fieldNum('肌肉蛋白', 'muscleProtein', p.muscleProtein, 'kg', 'step="0.1"');
  html += fieldNum('基础代谢', 'bmr', p.bmr, 'kcal', 'step="1"');
  html += fieldNum('体水分', 'water', p.water, '%', 'step="0.1"');
  html += fieldNum('身高', 'height', p.height, 'cm', 'step="1"');
  html += fieldNum('年龄', 'age', p.age, '岁', 'step="1"');
  html += '<div class="field full"><label>活动消耗怎么算</label><select class="input" data-field="actMode">' +
    '<option value="formula"' + (S.actMode==='formula'?' selected':'') + '>公式估算（BMR × 日常活动 ＋ 训练）</option>' +
    '<option value="watch"' + (S.actMode==='watch'?' selected':'') + '>手表：直接填全天总消耗</option>' +
    '<option value="split"' + (S.actMode==='split'?' selected':'') + '>分项：静息 + 运动 + 非运动活动</option>' +
    '</select></div>';

  if (S.actMode === 'formula'){
    /* 这两块文案带动态数字和公式，直接按语言给整句，避免翻译词典把句子拆碎 */
    var ENm = (S.lang === 'en');
    var neatOpts = ENm
      ? [[1.15,'Sedentary — desk / class, barely walking'],[1.25,'Light — campus walking, standing now and then'],[1.4,'Moderate — on your feet a lot, 8–10k steps'],[1.55,'Manual work — 10k+ steps or lifting things']]
      : [[1.15,'久坐 — 教室 / 电脑前，几乎不走动'],[1.25,'轻度 — 上下课走动、偶尔站着'],[1.4,'中度 — 常站着走动，每天 8k–1 万步'],[1.55,'体力劳动 — 1 万步以上或搬东西']];
    html += '<div class="field full"><label>' + (ENm ? 'Daily activity (excl. training)' : '日常活动（不含训练）') + '</label><select class="input" data-field="actNeat">' +
      neatOpts.map(function (a) { return '<option value="' + a[0] + '"' + (b.actNeat===a[0]?' selected':'') + '>' + a[0] + ' · ' + a[1] + '</option>'; }).join('') +
      '</select></div>';
    html += '<div class="field full"><label>' + (ENm ? 'Sessions per week' : '每周训练次数') + '</label><select class="input" data-field="actSess">' +
      [0,1,2,3,4,5,6].map(function (n) {
        return '<option value="' + n + '"' + (b.actSess===n?' selected':'') + '>' +
          (n ? n + (ENm ? '× / week' : ' 练 / 周') : (ENm ? 'No training' : '不训练')) + '</option>';
      }).join('') +
      '</select></div>';
    html += '<p class="src full" style="margin:-2px 0 2px">' + (ENm
      ? 'Daily average <b>' + Math.round(b.tdeeAvg) + ' kcal</b>'
      : '日平均 <b>' + Math.round(b.tdeeAvg) + ' kcal</b>') + '</p>';
    if ((b.planSess || 0) !== b.actSess){
      html += '<p class="src full" style="margin:-2px 0 2px;color:#8a4a08">' + (ENm
        ? 'Your plan has <b>' + (b.planSess || 0) + '</b> training day(s) but you set <b>' + b.actSess + '</b> session(s) — the total uses this number, the day-by-day split still follows the plan. Keep them equal if you can.'
        : '课表里排了 <b>' + (b.planSess || 0) + '</b> 个训练日，这里填了 <b>' + b.actSess + '</b> 次 —— 总热量按这里的次数折算，具体哪天用哪个值仍跟课表走，两边最好一致。') + '</p>';
    }
  } else if (S.actMode === 'watch'){
    html += '<div class="field full"><label>手表：近 7 天平均「总消耗」kcal</label>' +
      '<input class="input num" type="number" step="10" data-field="watchTotal" value="' + (S.watchTotal || '') + '" placeholder="例如 2450"></div>';
  } else {
    html += '<div class="field full"><label>手表：今天运动消耗 kcal</label>' +
      '<input class="input num" type="number" step="10" data-field="exKcal" value="' + (S.exKcal || '') + '" placeholder="训练记录里的活动热量"></div>';
    html += '<div class="field full"><label>运动之外的活动强度</label><select class="input" data-field="neat">' +
      [[1.15,'久坐为主（教室/图书馆/电脑前）'],[1.25,'日常走动多（校区通勤、常站着）'],[1.4,'体力工作 / 每天 1 万步以上']]
        .map(function (a) { return '<option value="' + a[0] + '"' + (S.neat==a[0]?' selected':'') + '>' + a[0] + ' · ' + a[1] + '</option>'; }).join('') +
      '</select></div>';
  }
  html += '</div>';

  html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">';
  html += '<div class="src" style="margin-bottom:6px">分段肌肉量（体脂秤，kg）</div>';
  html += '<div class="form-grid">';
  html += fieldNum('躯干', 'segTorso', p.segTorso, 'kg', 'step="0.1"');
  html += fieldNum('右臂', 'segArmR', p.segArmR, 'kg', 'step="0.1"');
  html += fieldNum('左臂', 'segArmL', p.segArmL, 'kg', 'step="0.1"');
  html += fieldNum('右腿', 'segLegR', p.segLegR, 'kg', 'step="0.1"');
  html += fieldNum('左腿', 'segLegL', p.segLegL, 'kg', 'step="0.1"');
  html += '</div></div>';

  html += '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)">';
  html += '<div class="src" style="margin-bottom:6px">今晨空腹体重记录</div>';
  html += '<div class="qadd"><input class="input num" type="number" step="0.1" id="wInput" placeholder="' + r1(b.weight) + '"><span class="muted" style="font-size:12px">kg</span><button class="btn sm" data-action="logWeight">记录</button></div>';
  var srcTxt = src.count > 1 ? src.label + ' ' + src.w + ' kg（' + src.count + ' 次记录取均值）' : src.label + ' ' + src.w + ' kg';
  html += '<p class="src" style="margin-top:8px">体重来源：<b>' + srcTxt + '</b></p>';
  html += '</div>';

  html += '</div></div>';

  /* 右：模型 */
  html += '<div style="display:flex;flex-direction:column;gap:16px">';
  html += '<div class="card"><div class="card-hd"><h3>身体模型</h3><span class="hint">颜色 = 分段相对参考区间</span></div><div class="card-bd">';
  html += '<div class="model-stage">';
  html += bodySvg(p);
  html += '<div class="ring-box">' + rings(b, p) + '</div>';
  html += '</div>';
  html += '<div class="legend">' +
    '<span><i style="background:#c9a227"></i>偏低</span>' +
    '<span><i style="background:#0d6e63"></i>正常</span>' +
    '<span><i style="background:#3b82a0"></i>偏高</span>' +
    '<span><i style="background:#e2e8e4"></i>未录入</span></div>';
  html += '<div class="grid g4" style="margin-top:14px">' +
    stat('瘦体重', b.lbm==null?'—':r1(b.lbm), 'kg', '体重 − 脂肪') +
    stat('脂肪量', b.fatMass==null?'—':r1(b.fatMass), 'kg', b.lbm!=null ? '目标 ' + r1(b.lbm/(1-b.bfGoal/100)) + ' kg @' + b.bfGoal + '%' : '需要先填体脂率') +
    stat('FFMI', b.ffmiAdj==null?'—':r1(b.ffmiAdj), '', '校正值，' + (b.sex === 'female' ? '15–18' : '18–20') + ' 为训练者区间') +
    stat('FMI', b.fmi==null?'—':r1(b.fmi), '', '脂肪指数') +
    '</div>';
  var tt = targets(todayKey());
  html += '<div class="grid g4" style="margin-top:10px">' +
    stat('训练日 TDEE', Math.round(b.tdeeTrain), 'kcal', '周均 ' + (b.tdeeTrain >= b.tdeeAvg ? '+' : '') + Math.round(b.tdeeTrain - b.tdeeAvg)) +
    stat('休息日 TDEE', Math.round(b.tdeeRest), 'kcal', '周均 ' + (b.tdeeRest >= b.tdeeAvg ? '+' : '') + Math.round(b.tdeeRest - b.tdeeAvg)) +
    stat('周均 TDEE', Math.round(b.tdeeAvg), 'kcal', b.tdeeSrc) +
    stat('今天要吃', tt.kcal, 'kcal', GOALS[S.goal].label + ' · ' + (tt.tr ? '训练日' : '休息日')) +
    '</div>';
  html += '<p class="src" style="margin-top:8px">今天（' + (tt.tr ? '训练日' : '休息日') + '）蛋白 ' + tt.p + ' g · 脂肪 ' + tt.fat +
          ' g · 碳水 ' + tt.c + ' g　|　蛋白 ' + (tt.p/b.weight).toFixed(1) + ' g/kg · BMI ' + r1(b.bmi) + '</p>';
  if (!b.complete){
    html += '<div class="warn-line">未填：' + b.missing.join('、') + '</div>';
  }
  html += '</div></div>';

  /* 策略说明 */
  html += '<div class="card"><div class="card-hd"><h3>当前策略：' + GOALS[S.goal].label + '</h3><span class="hint">在顶部切换</span></div><div class="card-bd">';
  html += '<p style="font-size:13px;color:var(--ink-2);margin-bottom:6px"><b>' + GOALS[S.goal].what + '</b></p>';
  html += '<p style="font-size:13px;color:var(--ink-2)">' + GOALS[S.goal].tip + '</p>';
  /* 五个策略的关键参数：用可换行的行式列表，窄屏不会被挤成竖条 */
  html += '<div class="goal-rows">';
  GOAL_ORDER.forEach(function (k) {
    var g = GOALS[k];
    html += '<div class="goal-row' + (k===S.goal?' on':'') + '">' +
      '<b>' + g.label + '</b>' +
      '<span>' + Math.round(g.kcal*100) + '% TDEE</span>' +
      '<span>蛋白 ' + g.proteinKg + ' g/kg</span>' +
      '<span>脂肪 ' + g.fatTrain + ' / ' + g.fatRest + ' g/kg</span>' +
      '</div>';
  });
  html += '</div>';
  html += '</div></div>';

  html += '</div></div>';
  return html;
}

function fieldNum(label, key, val, unit, attrs){
  return '<div class="field"><label>' + label + '（' + unit + '）</label>' +
    '<input class="input num" type="number" ' + (attrs||'') + ' data-profile="' + key + '" value="' + (val==null?'':val) + '"></div>';
}
function stat(k, v, unit, note){
  return '<div class="stat"><div class="k">' + k + '</div><div class="v num">' + v + (unit?'<small>' + unit + '</small>':'') + '</div><div class="n">' + note + '</div></div>';
}

function segColor(v, range){
  if (v == null || !v) return '#e2e8e4';
  if (v < range[0]) return '#c9a227';
  if (v > range[1]) return '#3b82a0';
  return '#0d6e63';
}

function bodySvg(p){
  var torso = segColor(p.segTorso, SEG_RANGE.torso);
  var armR = segColor(p.segArmR, SEG_RANGE.arm);
  var armL = segColor(p.segArmL, SEG_RANGE.arm);
  var legR = segColor(p.segLegR, SEG_RANGE.leg);
  var legL = segColor(p.segLegL, SEG_RANGE.leg);

  var s = '';
  s += '<svg viewBox="0 0 300 400" style="width:100%;max-width:330px;height:auto;display:block;margin:0 auto">';
  /* 先画四肢（顶端会被躯干盖住，形成自然连接） */
  s += '<path d="M137,192 L133,342" stroke="' + legL + '" stroke-width="26" stroke-linecap="round" fill="none"/>';
  s += '<path d="M163,192 L167,342" stroke="' + legR + '" stroke-width="26" stroke-linecap="round" fill="none"/>';
  s += '<path d="M113,90 L105,210" stroke="' + armL + '" stroke-width="19" stroke-linecap="round" fill="none"/>';
  s += '<path d="M187,90 L195,210" stroke="' + armR + '" stroke-width="19" stroke-linecap="round" fill="none"/>';
  /* 躯干：肩宽、腰收、髋略宽 */
  var torsoPath = 'M112,84 C120,76 133,73 150,73 C167,73 180,76 188,84 L181,150 C180,172 178,190 174,200 L126,200 C122,190 120,172 119,150 Z';
  s += '<path d="' + torsoPath + '" fill="' + torso + '" opacity="0.96"/>';
  s += '<path d="' + torsoPath + '" fill="url(#tgrad)"/>';
  /* 颈 + 头 */
  s += '<rect x="143" y="58" width="14" height="20" fill="#e6ece9" stroke="#cfd9d4" stroke-width="1.2"/>';
  s += '<circle cx="150" cy="43" r="20" fill="#e6ece9" stroke="#cfd9d4" stroke-width="1.2"/>';

  s += '<defs><linearGradient id="tgrad" x1="0" y1="0" x2="0" y2="1">' +
       '<stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#000" stop-opacity=".07"/></linearGradient></defs>';

  /* 躯干数值直接写在身上（白字），避免引线穿过手臂 */
  s += '<text x="150" y="124" font-size="9.5" fill="#ffffff" fill-opacity=".82" text-anchor="middle">躯干</text>';
  s += '<text x="150" y="140" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">' + p.segTorso + ' kg</text>';

  function label(x, y, anchor, text, val, color){
    var al = anchor === 'end' ? 'end' : 'start';
    var tx = x + (anchor==='end' ? -6 : 6);
    return '<text x="' + tx + '" y="' + (y-2) + '" font-size="9.5" fill="#7d8a83" text-anchor="' + al + '">' + text + '</text>' +
           '<text x="' + tx + '" y="' + (y+11) + '" font-size="11.5" font-weight="700" fill="' + color + '" text-anchor="' + al + '">' + val + ' kg</text>';
  }
  s += '<line x1="206" y1="200" x2="244" y2="200" stroke="#c9d5d0" stroke-width="1"/>' + label(244, 200, 'start', '右臂', p.segArmR, armR);
  s += '<line x1="95" y1="200" x2="58" y2="200" stroke="#c9d5d0" stroke-width="1"/>' + label(58, 200, 'end', '左臂', p.segArmL, armL);
  s += '<line x1="181" y1="292" x2="216" y2="292" stroke="#c9d5d0" stroke-width="1"/>' + label(216, 292, 'start', '双腿（单侧）', p.segLegR, legR);
  s += '</svg>';
  return s;
}

function absNote(b, bf){
  var f = (b.sex === 'female');
  var range = f ? '20–22%' : '13–15%';
  var goal = b.bfGoal;
  if (S.lang === 'en'){
    var en = 'Visible abs usually need ' + range + (f ? ' for women' : ' for men');
    if (bf == null) return en + '.';
    return en + '; at ' + bf + '%, ' +
      (bf > goal ? goal + '% is a realistic next stop.' : 'you are close to your ' + goal + '% target.');
  }
  var zh = '想看到清晰腹肌，' + (f ? '女性' : '男性') + '通常要 <b>' + range + '</b>';
  if (bf == null) return zh + '。';
  return zh + '；当前 ' + bf + '%，' +
    (bf > goal ? '先做到 ' + goal + '% 是现实目标。' : '已经接近 ' + goal + '% 的目标。');
}

function rings(b, p){
  var bf = b.bf;
  var bfMax = (b.sex === 'female') ? 40 : 28;       /* 环的量程按性别取 */
  var bfPct = bf != null ? Math.min(100, bf / bfMax * 100) : 0;
  var mm = p.muscleMass || 0;
  var mmPct = Math.min(100, mm / ((b.sex === 'female') ? 32 : 42) * 100);
  var h = '';
  h += '<div class="ring-item"><div class="ring" style="--p:' + bfPct.toFixed(0) + '"><span class="rv num">' + (bf != null ? bf + '%' : '—') + '</span></div>' +
       '<div class="rl">体脂率<br><b>目标 ' + b.bfGoal + '%</b><br><span class="src">' + (b.fatMass != null ? '脂肪 ' + r1(b.fatMass) + ' kg' : '未填体脂率') + '</span></div></div>';
  h += '<div class="ring-item"><div class="ring" style="--p:' + mmPct.toFixed(0) + '"><span class="rv num">' + (mm || '—') + '</span></div>' +
       '<div class="rl">肌肉量 kg<br><b>瘦体重 ' + (b.lbm != null ? r1(b.lbm) + ' kg' : '—') + '</b><br><span class="src">' +
       (p.water ? '水分 ' + p.water + '%' : '未填体水分') + '</span></div></div>';
  return h;
}

/* ================= 视图：模板 ================= */
function tplStatus(t){
  var months = t.months || 3;
  var created = t.created || iso(new Date());
  var exp = new Date(parse(created).getFullYear(), parse(created).getMonth() + months, parse(created).getDate());
  var left = Math.ceil((exp.getTime() - new Date().getTime()) / 86400000);
  return { months:months, created:created, exp:iso(exp), left:left, expired: left < 0 };
}

function methodCard(m, starred){
  var pr = prescFor(m.goal);
  var splitLbl = m.split === 'fb' ? '全身' : m.split === 'ul' ? '上下肢' : '推拉腿';
  var out = '<div class="mth' + (starred ? ' star' : '') + '">';
  if (starred) out += '<span class="mth-star" title="匹配当前目标">★</span>';
  out += '<div class="mth-top"><h4>' + h(m.name) + '</h4>' +
         '<span class="mth-goal">' + GOALS[m.goal].label + '</span></div>';
  out += '<div class="mth-meta">' + splitLbl + ' · ' + m.sessions + ' 练/周（' +
         m.days.slice(0, m.sessions).map(function(i2){ return '周' + WEEK_CN[i2]; }).join(' / ') +
         '）· 每次约 ' + m.mins + ' min</div>';
  out += '<div class="mth-facts">' +
         '<span>胸 ' + pr.chest[0] + '–' + pr.chest[1] + '</span>' +
         '<span>背 ' + pr.back[0] + '–' + pr.back[1] + '</span>' +
         '<span>腿 ' + pr.quad[0] + '–' + pr.quad[1] + '</span>' +
         '<span>RIR ' + pr.rir + '</span>' +
         '<span>休 ' + pr.rest + ' s</span>' +
         '<span class="fact-carb">' + (m.carb === 'split' ? '热量 训练日高 / 休息日低' : '热量 每天一致') + '</span>' +
         (m.carb === 'high' ? '<span class="fact-carb">碳水 全周高碳</span>' : '') +
         '</div>';
  out += '<p class="mth-desc">' + h(m.desc) + '</p>';
  out += '<div class="mth-foot"><span class="src">有氧：' + h(pr.cardio) + '</span>' +
         '<span class="mth-btns">' +
         '<button class="btn sm ghost" data-action="applySplit" data-id="' + m.id + '" title="只改分化与训练日，不动目标和吃法">只换课表</button>' +
         '<button class="btn sm primary" data-action="applyMethod" data-id="' + m.id + '">套用</button></span></div>';
  return out + '</div>';
}

/* ================= 导入数据：身体数据 + 自定义食材 ================= */
/* 只认这两块，别的字段一概不碰：训练记录、饮食记录、周计划、模板都不动。
   文件格式见下面给用户抄给 AI 的提示词（PACK_PROMPT_ZH / PACK_PROMPT_EN）。 */
var PACK_ALIAS = {
  sex:          ['sex','gender','性别'],
  age:          ['age','年龄'],
  height:       ['height','身高'],
  weight:       ['weight','体重'],
  bodyFat:      ['bodyFat','bodyfat','bodyFatPct','bodyFatRate','fatRate','fatPct','体脂率','体脂'],
  bfGoal:       ['bfGoal','bodyFatGoal','targetBodyFat','体脂目标'],
  muscleMass:   ['muscleMass','muscle','肌肉量'],
  muscleProtein:['muscleProtein','肌肉蛋白'],
  bmr:          ['bmr','BMR','basalMetabolism','基础代谢'],
  water:        ['water','bodyWater','体水分','体水分率'],
  visceral:     ['visceral','visceralFat','内脏脂肪','内脏脂肪等级'],
  bone:         ['bone','boneMass','骨量'],
  segTorso:     ['segTorso','torso','躯干'],
  segArmR:      ['segArmR','rightArm','armR','右臂'],
  segArmL:      ['segArmL','leftArm','armL','左臂'],
  segLegR:      ['segLegR','rightLeg','legR','右腿'],
  segLegL:      ['segLegL','leftLeg','legL','左腿']
};

/* 读一个数字：兼容 "17.5%"、"72,4 kg" 这类带单位或逗号的写法 */
function packNum(obj, keys){
  if (!obj) return null;
  for (var i = 0; i < keys.length; i++){
    var raw = obj[keys[i]];
    if (raw == null || raw === '') continue;
    var v = Number(String(raw).replace(',', '.').replace(/[^\d.\-]/g, ''));
    if (isFinite(v)) return v;
  }
  return null;
}

function applyPack(data){
  var res = { body:0, foods:0, weights:0 };
  if (!S.profile) S.profile = {};
  if (!Array.isArray(S.customFoods)) S.customFoods = [];
  if (!Array.isArray(S.foodsOn)) S.foodsOn = [];
  if (!S.weights) S.weights = {};

  /* ---- 1) 身体数据：只写有值且在合理区间内的项，越界的当噪声丢掉 ---- */
  var prof = data.profile || data.body || data.bodyData || data.bodyComposition || data;
  if (prof && typeof prof === 'object'){
    var sx = String(prof.sex != null ? prof.sex : (prof.gender != null ? prof.gender : (prof['性别'] || ''))).trim().toLowerCase();
    if (/^(male|m|男|男性)$/.test(sx)){ S.profile.sex = 'male'; res.body++; }
    else if (/^(female|f|女|女性)$/.test(sx)){ S.profile.sex = 'female'; res.body++; }
    Object.keys(PACK_ALIAS).forEach(function (k) {
      if (k === 'sex') return;
      var v = packNum(prof, PACK_ALIAS[k]);
      if (v == null) return;
      var rg = PROF_RANGE[k];
      if (rg && (v < rg[0] || v > rg[1])) return;
      S.profile[k] = Math.round(v * 10) / 10;
      res.body++;
    });
  }

  /* ---- 2) 自定义食材：按每 100 g 存，重名跳过 ---- */
  var foods = data.foods || data.customFoods || data['自定义食材'] || [];
  if (!Array.isArray(foods)) foods = [];
  var seen = {};
  S.customFoods.forEach(function (f) { seen[String(f.name || '').trim().toLowerCase()] = 1; });
  var ids = [];
  foods.forEach(function (it, i) {
    if (!it || typeof it !== 'object') return;
    var nm = String(it.name != null ? it.name : (it['名称'] != null ? it['名称'] : (it.title || it.food || ''))).trim();
    if (!nm || seen[nm.toLowerCase()]) return;
    var per = packNum(it, ['per','per100','per100g','base','每']);
    if (!per || per <= 0) per = 100;
    var k = 100 / per;                                  /* 不是每 100 g 的一律换算过来 */
    var p  = packNum(it, ['p','protein','蛋白质','蛋白']) || 0;
    var fa = packNum(it, ['f','fat','脂肪']) || 0;
    var c  = packNum(it, ['c','carb','carbs','carbohydrate','碳水','碳水化合物']) || 0;
    var kcal = packNum(it, ['kcal','calories','energy','热量','能量']);
    if (kcal == null) kcal = p * 4 + fa * 9 + c * 4;
    if (!(p || fa || c || kcal)) return;                /* 全空的不收 */
    var id = 'c' + Date.now().toString(36) + i;
    S.customFoods.push({
      id:id, group:id, variant:'', name:nm, cat:'custom', custom:true,
      p: Math.max(0, Math.round(p * k * 10) / 10),
      f: Math.max(0, Math.round(fa * k * 10) / 10),
      c: Math.max(0, Math.round(c * k * 10) / 10),
      kcal: Math.max(0, Math.round(kcal * k)),
      sugar: Math.max(0, Math.round((packNum(it,['sugar','糖']) || 0) * k * 10) / 10),
      fiber: Math.max(0, Math.round((packNum(it,['fiber','fibre','膳食纤维','纤维']) || 0) * k * 10) / 10),
      na: Math.max(0, Math.round((packNum(it,['na','sodium','钠']) || 0) * k)),
      max:500, src:'自定义'
    });
    seen[nm.toLowerCase()] = 1;
    ids.push(id);
  });
  if (ids.length){
    /* 新食材排在最前面，并且进入配平池 —— 跟手填一个自定义食材的行为一致 */
    S.foodOrder = ids.concat((S.foodOrder || []).filter(function (g) { return ids.indexOf(g) < 0; }));
    ids.forEach(function (id) { if (S.foodsOn.indexOf(id) < 0) S.foodsOn.push(id); });
    S.ui.qfFood = ids[0];
    res.foods = ids.length;
  }

  /* ---- 3) 体重记录 ---- */
  var ws = data.weights || data.weighIns || data['体重记录'] || data.weightLog || null;
  var latest = null;
  function putW(dk, kg){
    dk = String(dk || '').slice(0, 10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dk)) return;
    var v = Number(String(kg).replace(',', '.'));
    if (!isFinite(v) || v < 30 || v > 250) return;
    S.weights[dk] = Math.round(v * 10) / 10;
    res.weights++;
    if (!latest || dk > latest.d) latest = { d:dk, kg:S.weights[dk] };
  }
  if (Array.isArray(ws)){
    ws.forEach(function (w) {
      if (!w || typeof w !== 'object') return;
      putW(w.date || w.day || w.d || w['日期'], w.kg != null ? w.kg : (w.weight != null ? w.weight : w.v));
    });
  } else if (ws && typeof ws === 'object'){
    Object.keys(ws).forEach(function (k) { putW(k, ws[k]); });
  }
  if (latest) S.profile.weight = latest.kg;   /* 身体模型取最新一次体重 */
  return res;
}

/* 选文件和粘贴文本共用：容错解析 -> 写入 -> 提示。
   AI 常会带 ```json 围栏、BOM，或在 JSON 前后加一句话，这里都剥掉再试一次。 */
function importPackText(raw){
  var txt = String(raw == null ? '' : raw).replace(/^\uFEFF/, '').trim();
  txt = txt.replace(/^```[A-Za-z]*\s*/, '').replace(/\s*```$/, '').trim();
  var data = null;
  try { data = JSON.parse(txt); } catch (e0) {
    var i0 = txt.indexOf('{'), i1 = txt.lastIndexOf('}');
    if (i0 >= 0 && i1 > i0) { try { data = JSON.parse(txt.slice(i0, i1 + 1)); } catch (e1) { data = null; } }
  }
  var ENm = (S.lang === 'en');
  if (!data || typeof data !== 'object'){ toast(ENm ? 'That is not valid JSON' : '这段内容不是有效的 JSON'); return false; }
  if (data.logs && data.profile){ toast(ENm ? 'This is a full backup — import it under About · Backup' : '这是完整备份，请到「关于 · 备份」里导入'); return false; }
  var res = applyPack(data);
  if (!res.body && !res.foods && !res.weights){ toast(ENm ? 'No usable fields found — check the format' : '没找到能导入的字段，检查一下格式'); return false; }
  save(); render();
  toast(ENm
    ? ('Imported ' + [res.body ? res.body + ' body fields' : '',
                      res.foods ? res.foods + ' foods' : '',
                      res.weights ? res.weights + ' weigh-ins' : ''].filter(Boolean).join(' · '))
    : ('已导入' + (res.body ? ' 身体 ' + res.body + ' 项' : '') +
       (res.foods ? ' · 食材 ' + res.foods + ' 种' : '') +
       (res.weights ? ' · 体重 ' + res.weights + ' 条' : '')));
  return true;
}

function copyText(txt, cb){
  function fallback(){
    var ok = false;
    try {
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, txt.length);
      ok = document.execCommand('copy');
      ta.remove();
    } catch (e){ ok = false; }
    cb(ok);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function () { cb(true); }, fallback);
  } else fallback();
}

/* ================= 主渲染 ================= */
var VIEW_META = {
  week:      { title:'周计划', sub:'训练日高亮 · 每肌群周容量 · RIR' },
  nutrition: { title:'营养',   sub:'已吃 / 应吃 · 缺口换算' },
  body:      { title:'身体模型', sub:'体重均值驱动 · 改一个数全部重算' },
  templates: { title:'模板',   sub:'训练法库 · 按目标排序 · 存一次复用三个月' },
  plugins:   { title:'插件',   sub:'扩展点' },
};

function render(){
  try { renderNow(); }
  catch (err){
    var box = document.getElementById('view');
    if (box){
      box.innerHTML = '<div class="card"><div class="card-bd">' +
        '<h3>这一页暂时渲染不出来</h3>' +
        '<p class="src" style="margin-top:6px">你的数据没有丢。可以先用上面的导航切到别的页面，或者重新加载。</p>' +
        '<p class="src" style="margin-top:6px">' + h(err && err.message ? err.message : String(err)) + '</p>' +
        '<div style="margin-top:12px"><button class="btn sm ghost" data-action="reload">重新加载</button></div>' +
        '</div></div>';
    }
  }
}

function renderNow(){
  BM = computeBody();
  var v = S.ui.view;
  var html = v === 'week' ? viewWeek()
    : v === 'nutrition' ? viewNutrition()
    : v === 'body' ? viewBody()
    : v === 'templates' ? viewTemplates()
    : viewPlugins();

  el('view').innerHTML = trTxt(html);
  el('viewTitle').textContent = trTxt(VIEW_META[v].title);
  el('viewSub').textContent = trTxt(VIEW_META[v].sub);

  Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function (b) {
    b.classList.toggle('on', b.getAttribute('data-view') === v);
  });
  renderGoalSeg();
  mountSlots();
  applyShellLang();
  if (typeof Guide !== 'undefined' && Guide.active()) Guide.sync();   /* 指引开着时，重绘后重新对位置 */
  /* 侧栏「就绪 / 已保存」这类文字是写入时翻译的，切语言后补一次 */
  var ls = el('lastSaved');
  if (ls && S.lang === 'en' && /[\u4e00-\u9fa5]/.test(ls.textContent)) ls.textContent = trTxt(ls.textContent);
}

/* 点食材会整页重绘，浏览器自带的「滚动锚定」就失效了。
   记下被点那颗食材重绘前在屏幕上的纵坐标，重绘后把滚动补回去——
   位置不动，手指可以原地点第二下、第三下。 */
function keepChipTop(id, top){
  if (!id || typeof top !== 'number' || !isFinite(top)) return;
  var n = document.querySelector('.food-chips .food-chip[data-gid="' + id + '"]');
  if (!n) return;
  var d = n.getBoundingClientRect().top - top;
  if (Math.abs(d) > 0.5){ try { window.scrollBy(0, d); } catch (e) {} }
}

function renderGoalSeg(){
  var box = el('goalSeg');
  if (!box) return;                     /* 目标栏只在「模板」页出现 */
  box.innerHTML = GOAL_ORDER.map(function (k) {
    return '<button data-action="setGoal" data-goal="' + k + '" class="' + (S.goal===k?'on':'') + '">' + trTxt(GOALS[k].label) + '</button>';
  }).join('');
  var tip = el('goalTip');
  if (tip) tip.textContent = trTxt(GOALS[S.goal].tip || '');
}

/* ================= 事件 ================= */
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-action]');
  if (!t) return;
  var a = t.getAttribute('data-action');
  var d = t.dataset;

  /* ---- 新手指引 ---- */
  if (a === 'guideNext'){ Guide.next(); return; }
  if (a === 'guidePrev'){ Guide.prev(); return; }
  if (a === 'guideEnd'){ Guide.end(); return; }
  if (a === 'guideReplay'){ S.ui.guide = { v:0, done:false }; save(); Guide.start(); return; }

  /* ---- 日历 ---- */
  if (a === 'calMode'){ S.ui.calMode = d.mode; save(); render(); return; }
  if (a === 'monthMove'){ S.ui.monthOffset += (+d.n); save(); render(); return; }
  if (a === 'monthToday'){ S.ui.monthOffset = 0; save(); render(); return; }
  if (a === 'gotoDate'){
    S.ui.weekOffset = +d.off;
    S.ui.day = +d.dow;
    S.ui.calMode = 'week';
    save(); render(); return;
  }

  /* ---- 组数增减 ---- */
  if (a === 'addSet'){
    var lgA = logOf(d.date);
    var itA = lgA.items[+d.ex];
    if (!itA) return;
    var prev = itA.sets[itA.sets.length - 1] || { w:null, r:null };
    itA.sets.push({ w: prev.w, r: prev.r, done:false });
    save(); render(); return;
  }
  if (a === 'rmSet'){
    var lgR = logOf(d.date);
    var itR = lgR.items[+d.ex];
    if (!itR || itR.sets.length <= 1) return;
    itR.sets.pop();
    save(); render(); return;
  }

  /* ---- 替换 / 菜单 ---- */
  if (a === 'exMenu' || a === 'swapEx'){
    S.ui.replaceFor = { date: d.date, ex: +d.ex };
    render(); return;
  }
  if (a === 'closeSheet'){ S.ui.replaceFor = null; S.ui.pickSession = null; render(); return; }
  if (a === 'swapTo'){
    var dtS = d.date, iS = +d.ex, newName = d.name;
    var lgS = logOf(dtS);
    var itS = lgS.items[iS];
    if (!itS) return;
    var oldName = itS.name;
    if (newName === '__delete'){
      lgS.items.splice(iS, 1);
      persistDay(dtS, function (dp) { dp.exercises = dp.exercises.filter(function (e) { return e.name !== oldName; }); });
    } else {
      var lpS = lastPerf(newName, dtS);
      lgS.items[iS] = { name:newName, sets: itS.sets.map(function (s) {
        return { w: lpS ? (lpS.maxW || null) : s.w, r: s.r, done: s.done };
      })};
      persistDay(dtS, function (dp) {
        dp.exercises = dp.exercises.map(function (e) {
          return e.name === oldName ? { name:newName, sets:e.sets, reps:e.reps, w: lpS ? (lpS.maxW || e.w) : e.w } : e;
        });
      });
    }
    S.ui.replaceFor = null;
    save(); render(); toast(newName === '__delete' ? '已删除' : '已换成 ' + newName);
    return;
  }
  if (a === 'excludePat'){
    var pat = d.pat;
    var at3 = S.excludePatterns.indexOf(pat);
    if (at3 >= 0) S.excludePatterns.splice(at3, 1); else S.excludePatterns.push(pat);
    save(); render(); return;
  }
  if (a === 'moveEx'){
    var lgM = logOf(d.date), iM = +d.ex, nM = iM + (+d.n);
    if (nM < 0 || nM >= lgM.items.length) return;
    var tmp = lgM.items[iM];
    lgM.items[iM] = lgM.items[nM];
    lgM.items[nM] = tmp;
    S.ui.replaceFor = { date: d.date, ex: nM };
    save(); render(); return;
  }

  /* ---- 食材管理 ---- */
  if (a === 'toggleAddFood'){
    S.ui.addFood = !S.ui.addFood;
    S.ui.editFoodId = null;    /* 手点开关就退出编辑，下次是新建 */
    render(); return;
  }
  if (a === 'toggleChipEdit'){
    S.ui.chipEdit = !S.ui.chipEdit;
    if (!S.ui.chipEdit) S.ui.editGroup = null;
    save(); render(); return;
  }
  /* 编辑模式顶部那颗「编辑」：改的就是当前选中的食材（多规格时只改当前规格） */
  if (a === 'editFood'){
    if (!S.ui.editGroup){ toast('先点一下要编辑的食材'); return; }
    var ef = activeFoodFor(S.ui.editGroup);
    if (!ef){ toast('先点一下要编辑的食材'); return; }
    S.ui.editFoodId = ef.id;
    S.ui.addFood = true;
    S.ui.chipEdit = false;
    S.ui.editGroup = null;
    save(); render();
    var boxAF = document.querySelector('.addfood');
    if (boxAF && boxAF.scrollIntoView) boxAF.scrollIntoView({ block:'center', behavior:'smooth' });
    return;
  }
  if (a === 'restoreHidden'){ S.foodHidden = []; save(); render(); return; }
  if (a === 'saveFood'){
    var nm = (el('nfName') || {}).value || '';
    if (!nm.trim()){ toast('先给食材起个名字'); return; }
    var pp2 = parseFloat((el('nfP')||{}).value) || 0;
    var ff = parseFloat((el('nfF')||{}).value) || 0;
    var cc = parseFloat((el('nfC')||{}).value) || 0;
    var kk = parseFloat((el('nfK')||{}).value) || (pp2*4 + ff*9 + cc*4);
    var vals = {
      name: nm.trim(), p: pp2, f: ff, c: cc,
      sugar: parseFloat((el('nfS')||{}).value) || 0,
      fiber: parseFloat((el('nfFi')||{}).value) || 0,
      na: parseFloat((el('nfNa')||{}).value) || 0,
      kcal: Math.round(kk)
    };

    var eid2 = S.ui.editFoodId || null;
    if (eid2){
      /* 改的是已有食材：自定义的直接改那一条，内置的写进 foodEdits 覆盖层 */
      var isCustom = (S.customFoods || []).some(function (f) { return f.id === eid2; });
      if (isCustom){
        S.customFoods.forEach(function (f) {
          if (f.id !== eid2) return;
          for (var k in vals) f[k] = vals[k];
        });
      } else {
        var prev = S.foodEdits[eid2] || {};
        var o = {};
        for (var k2 in prev) if (Object.prototype.hasOwnProperty.call(prev, k2)) o[k2] = prev[k2];
        for (var k3 in vals) if (Object.prototype.hasOwnProperty.call(vals, k3)) o[k3] = vals[k3];
        S.foodEdits[eid2] = o;
      }
      /* 数值变了，配平结果要重算；克数保留，方便对照 */
      Object.keys(S.bal || {}).forEach(function (dk2) {
        var rec2 = S.bal[dk2];
        if (rec2) rec2.solved = false;
      });
      var nmOut = vals.name;
      S.ui.addFood = false;
      S.ui.editFoodId = null;
      S.ui.chipEdit = false;
      save(); render();
      toast('已更新「' + nmOut + '」');
      return;
    }

    var id = 'c' + Date.now().toString(36);
    var food = {
      id:id, group:id, variant:'', name:vals.name, cat:'custom', custom:true,
      p:vals.p, f:vals.f, c:vals.c,
      sugar: vals.sugar,
      fiber: vals.fiber,
      na: vals.na,
      kcal: vals.kcal, max:500, src:'自定义'
    };
    S.customFoods.push(food);
    /* 放到最前面：食材栏和「快速记录」下拉都会立刻出现在第一行 */
    S.foodOrder = [id].concat((S.foodOrder || []).filter(function (g) { return g !== id; }));
    if (S.foodsOn.indexOf(id) < 0) S.foodsOn.push(id);
    S.ui.addFood = false;
    S.ui.qfFood = id;                  /* 自动选中：填个克数点「加入」就能记 */
    save(); render();
    toast('已添加「' + food.name + '」 · 填克数点「加入」就能记到今天');
    return;
  }
  if (a === 'delFood'){
    S.customFoods = (S.customFoods || []).filter(function (f) { return (f.group || f.id) !== d.id; });
    S.foodOrder = (S.foodOrder || []).filter(function (g) { return g !== d.id; });
    S.foodsOn = S.foodsOn.filter(function (g) { return g !== d.id; });
    save(); render(); return;
  }

  /* ---- 配平 ---- */
  if (a === 'doBalance'){
    solveBalance(S.ui.nutDate, true);
    save(); render(); toast('已配平'); return;
  }
  if (a === 'clearBalance'){

  }
  if (a === 'lockFood'){
    var recL = S.bal[S.ui.nutDate] || (S.bal[S.ui.nutDate] = { g:{}, locked:{} });

  }
  if (a === 'addCat'){
    var cat = d.cat;
    var pick = foodRegistry().filter(function(g){ return g.cat === cat && S.foodsOn.indexOf(g.id) < 0; })[0];
    if (!pick){ toast('这类食材都已经在列表里了'); return; }
    S.foodsOn.push(pick.id);
    var recA = S.bal[S.ui.nutDate];
    if (recA){ recA.g = {}; recA.solved = false; }
    save(); render(); toast('已加入 ' + pick.name); return;
  }

  if (a === 'toggleLang'){
    S.lang = (S.lang === 'en') ? 'zh' : 'en';

  }

  if (a === 'setGoal'){ S.goal = d.goal; save(); render(); toast('策略已切换：' + GOALS[S.goal].label); return; }
  if (a === 'weekMove'){ S.ui.weekOffset += (+d.n); save(); render(); return; }
  if (a === 'weekToday'){ S.ui.weekOffset = 0; S.ui.day = dayIdxOf(todayKey()); save(); render(); return; }
  if (a === 'selectDay'){ S.ui.day = +d.i; save(); render(); return; }
  if (a === 'toggleSetup'){ S.ui.setup = !S.ui.setup; render(); return; }

  if (a === 'toggleDay'){
    var i = +d.i, arr = S.weekly.days.slice();
    var at = arr.indexOf(i);
    if (at >= 0) arr.splice(at,1); else arr.push(i);
    arr.sort(function(x,y){ return x-y; });
    if (arr.length < 2){ toast('至少保留 2 个训练日'); return; }
    S.weekly.days = arr;

    if (S.weekly.sessions < arr.length && S.weekly.sessions < 2) S.weekly.sessions = 2;

  if (a === 'pickSession'){
    S.ui.pickSession = { date: d.date };

  }

  if (a === 'setSession'){
    var dkS = d.date, key = d.key, wkS = weekKeyOf(dkS), diS = dayIdxOf(dkS);
    if (!S.plans[wkS]) S.plans[wkS] = {};

    var oldLog = S.logs[dkS];

    if (oldLog && oldLog.items){
      oldLog.items.forEach(function(it){ it.sets.forEach(function(st){ if (st.done) didWork = true; }); });
    }
    if (didWork && !confirm(trTxt('这天已经记过完成的组，换课会清空当天的勾选。继续？'))) return;

    if (key === 'BLANK'){

    } else {

      if (!defS) return;
      S.plans[wkS][diS] = { type:'train', title:defS.name, tag:defS.tag,

    }

    if (!S.cardio) S.cardio = {};

  if (a === 'applyMethod'){

  if (a === 'applySplit'){

  if (a === 'tplExpand'){

  if (a === 'delEx'){

  if (a === 'resetSets'){

  if (a === 'saveWeekTpl'){

    });

  }



  if (a === 'applySaved'){
    var tp = S.templates[+d.i];
    if (!tp) return;
    var wk = iso(currentMonday());

    for (var i = 0; i < 7; i++) o[i] = { type:'rest' };
    tp.days.forEach(function (x) {
      o[x.idx] = { type:'train', title:x.title, tag:x.tag, exercises: x.exercises.map(function(e){ return {name:e.name,sets:e.sets,reps:e.reps,w:e.w}; }) };
